<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Katz Konnection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --panel: #10151c;
    --panel-2: #151c26;
    --line: rgba(255,255,255,0.06);
    --text: #ffffff;
    --dim: #8a94a6;
    --live: #ff3b3b;
    --final: #6b7280;
    --upcoming: #f4b942;
    --diamond-on: #ffd84a;
    --diamond-off: rgba(255,255,255,0.12);
    --accent-text: #ffd84a;          /* gold used as text (series, notes, scores in ticker) */
    --line-strong: rgba(255,255,255,0.18);
    --glow-1: rgba(255,59,59,0.06);
    --glow-2: rgba(244,185,66,0.04);
    --live-border: rgba(255,59,59,0.25);
    --gold-border: rgba(255,216,74,0.3);
    --logo-shadow: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    --overlay-shadow: 0 30px 80px rgba(0,0,0,0.7);
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-2: #f3f5f8;
    --line: rgba(15,23,42,0.08);
    --text: #0b1220;
    --dim: #5b6475;
    --live: #e11d2e;
    --final: #9aa1ad;
    --upcoming: #c98a00;
    --diamond-on: #f5b800;
    --diamond-off: rgba(15,23,42,0.1);
    --accent-text: #a26f00;
    --line-strong: rgba(15,23,42,0.2);
    --glow-1: rgba(225,29,46,0.07);
    --glow-2: rgba(201,138,0,0.06);
    --live-border: rgba(225,29,46,0.35);
    --gold-border: rgba(162,111,0,0.35);
    --logo-shadow: drop-shadow(0 1px 2px rgba(15,23,42,0.15));
    --overlay-shadow: 0 30px 80px rgba(15,23,42,0.25);
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Archivo', sans-serif;
    overflow: hidden;
  }

  /* 1920x1080 stage, scaled to viewport */
  #stage-wrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 0%, var(--glow-1), transparent 40%),
      radial-gradient(circle at 100% 100%, var(--glow-2), transparent 40%),
      var(--bg);
  }

  #stage {
    width: 1920px;
    height: 1080px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    display: grid;
    grid-template-rows: 120px 1fr 50px;
    padding: 32px 48px;
    gap: 20px;
  }

  /* Header */
  header {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 32px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .brand-mark {
    width: 72px;
    height: 72px;
    border-radius: 14px;
    color: #fff;
    background: linear-gradient(135deg, #ff3b3b 0%, #b80d0d 100%);
    display: grid;
    place-items: center;
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 38px;
    letter-spacing: -2px;
    box-shadow: 0 10px 40px rgba(255,59,59,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .brand-text .title {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 44px;
    letter-spacing: -1.5px;
    line-height: 0.9;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .brand-text .title em {
    font-style: normal;
    color: var(--live);
  }

  .brand-text .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .header-center {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .stat-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 24px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    min-width: 110px;
  }

  .stat-chip .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .stat-chip .value {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 32px;
    line-height: 1;
    margin-top: 4px;
  }

  .stat-chip.live .value { color: var(--live); }
  .stat-chip.final .value { color: var(--dim); }
  .stat-chip.upcoming .value { color: var(--upcoming); }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .clock {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1;
    letter-spacing: -0.5px;
  }

  .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .date .archive { color: var(--accent-text); }

  /* Day navigation + pager */
  .date-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-right { position: relative; }

  .date-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
  }

  .date-btn svg, .theme-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .nav-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    height: 42px;
    min-width: 42px;
    padding: 0 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .nav-btn:hover { border-color: var(--line-strong); background: var(--panel-2); }
  .nav-btn.arrow { font-size: 20px; padding: 0; }
  .stat-chip.pager .nav-btn { height: 30px; min-width: 30px; font-size: 18px; padding: 0; }
  .nav-btn[hidden], .stat-chip[hidden] { display: none; }

  .stat-chip.pager .value {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 26px;
  }

  /* Grid of games */
  #games {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 14px;
    align-content: start;
    overflow: hidden;
    min-height: 0;
  }

  .game {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 18px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 6px;
    min-height: 0;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }

  .game::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--final);
    transition: background 0.3s ease;
  }

  .game.live::before { background: var(--live); box-shadow: 0 0 20px var(--live); }
  .game.upcoming::before { background: var(--upcoming); }
  .game.live { border-color: var(--live-border); }
  .game.clickable { cursor: pointer; }
  .game.clickable:hover { border-color: var(--line-strong); background: var(--panel-2); }

  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--final);
  }

  .game.live .status .dot {
    background: var(--live);
    animation: pulse 1.4s ease-in-out infinite;
  }

  .game.live .status { color: var(--live); }
  .game.upcoming .status { color: var(--upcoming); }
  .game.upcoming .status .dot { background: var(--upcoming); }
  .game.final .status { color: var(--dim); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px 7px;
    margin-left: auto;
    white-space: nowrap;
  }

  .tag.post { color: var(--accent-text); border-color: var(--gold-border); }

  .inning-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .game.live .inning-info { color: var(--text); font-weight: 700; }

  .teams {
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    align-content: center;
  }

  .team-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 2px 4px;
  }

  .team-row.winner .team-name { color: var(--text); }
  .team-row.loser .team-name,
  .team-row.loser .score,
  .team-row.loser .hits { color: var(--dim); }

  .logo {
    width: 34px;
    height: 34px;
    border-radius: 6px;
    background: var(--panel-2);
    display: grid;
    place-items: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: var(--logo-shadow);
  }

  .team-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    line-height: 1;
  }

  .team-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .score {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 36px;
    line-height: 1;
    min-width: 48px;
    text-align: right;
    transition: color 0.3s ease;
  }

  .score.flash {
    animation: scoreFlash 0.8s ease-out;
  }

  @keyframes scoreFlash {
    0%   { color: var(--accent-text); text-shadow: 0 0 20px var(--diamond-on); transform: scale(1.15); }
    100% { color: var(--text); text-shadow: none; transform: scale(1); }
  }

  .hits {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--dim);
    min-width: 34px;
    text-align: right;
  }

  .hits small { font-size: 9px; margin-left: 2px; letter-spacing: 1px; }

  .game-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-top: 6px;
    border-top: 1px solid var(--line);
    min-height: 38px;
  }

  /* Diamond (bases) */
  .diamond-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Bases drawn as individually rotated squares so the diamond stays inside the 26px footer row */
  .diamond {
    width: 40px;
    height: 26px;
    position: relative;
  }

  .base {
    position: absolute;
    width: 10px;
    height: 10px;
    transform: rotate(45deg);
    background: var(--diamond-off);
    border: 1px solid var(--line-strong);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  .base.on {
    background: var(--diamond-on);
    box-shadow: 0 0 12px var(--diamond-on);
  }

  .base.first { right: 2px; top: 13px; }
  .base.second { left: 15px; top: 2px; }
  .base.third { left: 2px; top: 13px; }

  .outs {
    display: flex;
    gap: 4px;
  }

  .out {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--diamond-off);
    border: 1px solid var(--line-strong);
  }

  .out.on { background: var(--diamond-on); }

  .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 1px;
  }

  .pitcher-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.5px;
    line-height: 1.5;
  }

  .pitcher-info .label {
    color: var(--live);
    font-weight: 700;
    margin-right: 4px;
  }

  .pitcher-info .series { color: var(--accent-text); font-weight: 700; }

  /* Footer ticker */
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 20px;
    overflow: hidden;
  }

  .ticker-label {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--live);
    padding-right: 20px;
    border-right: 1px solid var(--line);
    margin-right: 20px;
    flex-shrink: 0;
  }

  .ticker-viewport {
    flex: 1;
    overflow: hidden;
    position: relative;
    height: 50px;
    display: flex;
    align-items: center;
  }

  .ticker-track {
    display: flex;
    gap: 40px;
    padding-right: 40px;
    white-space: nowrap;
    animation: ticker 90s linear infinite;
  }

  .ticker-item {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text);
    letter-spacing: 0.5px;
  }

  .ticker-item .separator { color: var(--live); margin: 0 10px; }
  .ticker-item .team-abbr { font-weight: 700; }
  .ticker-item .score-val { color: var(--accent-text); font-weight: 700; }

  @keyframes ticker {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* Empty / offseason state */
  .empty {
    grid-column: 1 / -1;
    grid-row: 1 / -1;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    text-align: center;
    font-family: 'Archivo', sans-serif;
    color: var(--dim);
  }

  .empty .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 14px;
  }

  .empty h2 {
    font-size: 96px;
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -3px;
    text-transform: uppercase;
    color: var(--text);
  }

  .empty h2 em { font-style: normal; color: var(--live); }

  .empty .sub {
    font-size: 22px;
    margin-top: 16px;
  }

  .champ {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 24px 40px 24px 28px;
    background: var(--panel);
    border: 1px solid var(--gold-border);
    border-radius: 14px;
    position: relative;
    overflow: hidden;
  }

  .champ::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--diamond-on);
    box-shadow: 0 0 20px var(--diamond-on);
  }

  .champ .logo { width: 96px; height: 96px; border-radius: 12px; }

  .champ .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent-text);
    text-transform: uppercase;
    text-align: left;
  }

  .champ .name {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 48px;
    line-height: 1.1;
    text-transform: uppercase;
    color: var(--text);
    text-align: left;
  }

  .champ .result {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-align: left;
    text-transform: uppercase;
  }

  .countdowns {
    display: flex;
    gap: 20px;
  }

  .countdown {
    min-width: 340px;
    padding: 22px 32px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  .countdown .days {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1;
    color: var(--upcoming);
  }

  .countdown .days small {
    font-size: 22px;
    color: var(--dim);
    margin-left: 6px;
    letter-spacing: 1px;
  }

  .countdown .what {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text);
    margin-top: 12px;
  }

  .countdown .when {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .loading {
    grid-column: 1 / -1;
    grid-row: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--dim);
    letter-spacing: 2px;
  }

  /* Calendar popover */
  #cal {
    position: absolute;
    top: 150px;
    right: 48px;
    z-index: 20;
    width: 560px;
    display: none;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    box-shadow: var(--overlay-shadow);
  }

  #cal.open { display: block; animation: gameIn 0.2s ease-out; }

  .cal-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .cal-head select {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 22px;
    text-transform: uppercase;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    height: 42px;
    padding: 0 10px;
    cursor: pointer;
  }

  .cal-head .spacer { flex: 1; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .cal-dow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--dim);
    text-align: center;
    padding-bottom: 4px;
  }

  .cal-day {
    height: 62px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 600;
    line-height: 1;
    transition: border-color 0.15s ease;
  }

  .cal-day:hover { border-color: var(--line-strong); }
  .cal-day small {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--accent-text);
  }
  .cal-day.none { color: var(--dim); background: transparent; }
  .cal-day.none small { color: var(--dim); }
  .cal-day.today { border-color: var(--live); }
  .cal-day.selected { background: var(--live); border-color: var(--live); color: #fff; }
  .cal-day.selected small { color: #fff; }
  .cal-day:disabled { opacity: 0.25; cursor: default; }

  .cal-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--dim);
    text-transform: uppercase;
  }

  /* Box score overlay */
  #box {
    position: absolute;
    left: 48px;
    right: 48px;
    top: 172px;
    bottom: 32px;
    z-index: 10;
    display: none;
    flex-direction: column;
    gap: 18px;
    padding: 22px 28px;
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    box-shadow: var(--overlay-shadow);
    overflow: auto;
  }

  #box.open { display: flex; animation: gameIn 0.3s ease-out; }

  .box-top {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .box-title {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 30px;
    letter-spacing: -0.5px;
    text-transform: uppercase;
  }

  .box-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--dim);
  }

  .box-status.live { color: var(--live); }
  .box-top .tag { margin-left: 0; }
  .box-top .nav-btn { margin-left: auto; font-size: 14px; padding: 0 16px; }

  .box-head {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 40px;
    align-items: center;
  }

  table.ls {
    border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
  }

  table.ls th, table.ls td {
    padding: 5px 9px;
    min-width: 36px;
    text-align: center;
  }

  table.ls th {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--dim);
    border-bottom: 1px solid var(--line);
  }

  table.ls td.team {
    text-align: left;
    min-width: 120px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 22px;
  }

  table.ls td.team span { display: flex; align-items: center; gap: 10px; }
  table.ls td.team img { width: 28px; height: 28px; object-fit: contain; }
  table.ls .rhe { font-weight: 700; }
  table.ls .rhe.first { border-left: 1px solid var(--line-strong); }
  table.ls td.rhe.first { color: var(--accent-text); }

  .box-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.8;
    color: var(--dim);
    letter-spacing: 0.5px;
  }

  .box-info b { color: var(--text); font-weight: 700; }
  .box-info .dec { color: var(--live); font-weight: 700; margin-right: 4px; }

  .box-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }

  .box-team h3 {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .box-team h3 img { width: 26px; height: 26px; object-fit: contain; }

  table.stats {
    width: 100%;
    border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
  }

  table.stats + table.stats { margin-top: 12px; }

  table.stats th {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--dim);
    text-align: right;
    padding: 5px 6px;
    border-bottom: 1px solid var(--line-strong);
  }

  table.stats td {
    text-align: right;
    padding: 3px 6px;
    border-bottom: 1px solid var(--line);
  }

  table.stats th:first-child, table.stats td:first-child { text-align: left; width: 40%; }
  table.stats td .pos { color: var(--dim); margin-left: 6px; font-size: 11px; }
  table.stats td .note { color: var(--accent-text); margin-left: 6px; font-size: 11px; }
  table.stats tr.sub td:first-child { padding-left: 20px; }
  table.stats td.season { color: var(--dim); }
  table.stats tr.total td { font-weight: 700; border-bottom: none; }

  .box-notes {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--dim);
    margin-top: 8px;
  }

  .box-notes b { color: var(--text); }

  .box-msg {
    margin: auto;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px;
    color: var(--dim);
  }

  .game-enter {
    animation: gameIn 0.5s ease-out backwards;
  }

  @keyframes gameIn {
    0%   { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <header>
      <div class="brand">
        <div class="brand-mark">K</div>
        <div class="brand-text">
          <div class="title">THE KATZ <em>KONNECTION</em></div>
          <div class="subtitle" id="subtitle">MLB · LIVE ACTIVE GAMES</div>
        </div>
      </div>
      <div class="header-center">
        <div class="stat-chip live">
          <div class="label">Live</div>
          <div class="value" id="count-live">0</div>
        </div>
        <div class="stat-chip final">
          <div class="label">Final</div>
          <div class="value" id="count-final">0</div>
        </div>
        <div class="stat-chip upcoming">
          <div class="label">Upcoming</div>
          <div class="value" id="count-upcoming">0</div>
        </div>
        <div class="stat-chip pager" id="pager" hidden>
          <div class="label">Page</div>
          <div class="value">
            <button class="nav-btn" data-page="-1" aria-label="Previous page">‹</button>
            <span id="page-num">1/1</span>
            <button class="nav-btn" data-page="1" aria-label="Next page">›</button>
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="clock" id="clock">-:--</div>
        <div class="date-nav">
          <button class="nav-btn arrow" id="day-prev" aria-label="Previous day">‹</button>
          <button class="nav-btn date-btn" id="cal-btn" aria-label="Pick a date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="date" id="date"></span></button>
          <button class="nav-btn arrow" id="day-next" aria-label="Next day">›</button>
          <button class="nav-btn" id="day-today" hidden>Today</button>
          <button class="nav-btn theme-btn" id="theme-btn" aria-label="Toggle light and dark"></button>
        </div>
      </div>
    </header>

    <section id="games">
      <div class="loading">LOADING LIVE FEED…</div>
    </section>

    <footer>
      <div class="ticker-label" id="ticker-label">SCORES</div>
      <div class="ticker-viewport">
        <div class="ticker-track" id="ticker">
          <div class="ticker-item">Connecting to feed…</div>
        </div>
      </div>
    </footer>

    <section id="box"></section>
    <section id="cal"></section>
  </div>
</div>

<script>
  /* =========================================================
     THE KATZ KONNECTION: MLB Active Games Board
     Polls the MLB Stats API and re-renders itself.
     Fixed 1920x1080 stage, CSS-scaled to any viewport.

     URL params:
       ?date=YYYY-MM-DD   show a specific day (archive / testing)

     ?theme=light|dark  force a theme (otherwise the toggle's last choice)

     Controls: ‹ › in the header (or arrow keys) step through days,
     the date opens a calendar (back to 1901-04-18),
     the PAGE chip pages past 12 games, click a game for its box score
     (Esc closes).
     ========================================================= */

  const API = 'https://statsapi.mlb.com/api/v1/schedule';
  const GAME_TYPES = 'S,R,A,F,D,L,W'; // spring, regular, All-Star, postseason rounds
  const MAX_CARDS = 12;               // 3x4 grid on the 1080 stage
  const ROLLOVER_HOUR = 6;            // before 6am local, keep showing yesterday's slate
  const POLL_LIVE = 15 * 1000;        // any game in progress
  const POLL_IDLE = 60 * 1000;        // games today, none live
  const POLL_EMPTY = 30 * 60 * 1000;  // no games on the board date
  const LOOKAHEAD_DAYS = 200;         // far enough to reach spring training from October
  const PAGE_ROTATE = 20 * 1000;      // auto-advance pages on heavy days...
  const IDLE_BEFORE_ROTATE = 60 * 1000; // ...once nobody has touched the board for a minute

  const POSTSEASON = {
    F: { short: 'WC', long: 'Wild Card' },
    D: { short: 'DS', long: 'Division Series' },
    L: { short: 'LCS', long: 'League Championship Series' },
    W: { short: 'WS', long: 'World Series' }
  };

  const FIRST_DATE = '1901-04-18';   // earliest game day in the Stats API (modern AL/NL)

  // --- Theme --------------------------------------------------
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    // Show the icon for the theme you'd switch to
    document.getElementById('theme-btn').innerHTML = theme === 'light' ? MOON : SUN;
  }

  function initialTheme() {
    const fromUrl = new URLSearchParams(location.search).get('theme');
    if (fromUrl === 'light' || fromUrl === 'dark') return fromUrl;
    try { return localStorage.getItem('kk-theme') || 'dark'; } catch (e) { return 'dark'; }
  }

  applyTheme(initialTheme());
  document.getElementById('theme-btn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('kk-theme', next); } catch (e) { /* private mode */ }
  });

  function dateFromUrl() {
    const d = new URLSearchParams(location.search).get('date') || '';
    return /^\d{4}-\d{2}-\d{2}$/.test(d) && d >= FIRST_DATE ? d : null;
  }
  let dateOverride = dateFromUrl();

  // --- Responsive scale of the 1920x1080 stage ------------------
  function scaleStage() {
    const stage = document.getElementById('stage');
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  window.addEventListener('resize', scaleStage);
  scaleStage();

  // --- Date helpers -------------------------------------------
  const pad = n => String(n).padStart(2, '0');
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  // Local-midnight Date for a YYYY-MM-DD string (avoids the UTC shift of new Date('YYYY-MM-DD'))
  function fromISO(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function addDays(iso, n) {
    const d = fromISO(iso);
    d.setDate(d.getDate() + n);
    return toISO(d);
  }

  function daysBetween(fromIso, toIso) {
    return Math.round((fromISO(toIso) - fromISO(fromIso)) / 86400000);
  }

  // Today's slate, honoring the early-morning rollover
  function todayBoardDate() {
    const now = new Date();
    if (now.getHours() < ROLLOVER_HOUR) now.setDate(now.getDate() - 1);
    return toISO(now);
  }

  function boardDate() {
    return dateOverride || todayBoardDate();
  }

  function prettyDate(iso, opts) {
    return fromISO(iso).toLocaleDateString('en-US', opts || { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
  }

  // --- Clock --------------------------------------------------
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    const iso = boardDate();
    const dateEl = document.getElementById('date');
    const label = prettyDate(iso, dateOverride
      ? { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }
      : undefined);
    dateEl.innerHTML = dateOverride ? `<span class="archive">${label}</span>` : label;
    document.getElementById('cal-btn').title = dateOverride ? 'Archive date: pick another day' : 'Pick a date';
    document.getElementById('day-today').hidden = !dateOverride;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // --- State --------------------------------------------------
  const previousScores = new Map(); // gamePk -> {home, away}
  let previousGameKeys = new Set();
  let offseasonCache = { date: null, data: null };
  let lastGames = [];               // sorted slate from the latest poll
  const gameIndex = new Map();      // gamePk -> game, for the box score
  let currentPage = 0;
  let lastInteraction = 0;

  // --- Helpers ------------------------------------------------
  function logoUrl(teamId) {
    return `https://www.mlbstatic.com/team-logos/${teamId}.svg`;
  }

  function formatGameTime(g) {
    if (g.status && g.status.startTimeTBD) return 'TIME TBD';
    return new Date(g.gameDate).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  }

  function inningSuffix(n) {
    if (n >= 11 && n <= 13) return 'th';
    const last = n % 10;
    if (last === 1) return 'st';
    if (last === 2) return 'nd';
    if (last === 3) return 'rd';
    return 'th';
  }

  function lastName(fullName) {
    if (!fullName) return 'TBD';
    const parts = fullName.split(' ');
    while (parts.length > 1 && /^(Jr\.?|Sr\.?|II|III|IV|V)$/.test(parts[parts.length - 1])) parts.pop();
    return parts[parts.length - 1];
  }

  function abbr(side) {
    return side.team.abbreviation || side.team.name.slice(0, 3).toUpperCase();
  }

  // Off-the-field states: postponed, cancelled, suspended. Sorted with finals, no winner styling.
  function isOffState(game) {
    return /Postponed|Cancelled|Suspended/.test(game.status?.detailedState || '');
  }

  function statusBucket(game) {
    const abs = game.status?.abstractGameState || '';
    const detailed = game.status?.detailedState || '';
    if (isOffState(game)) return 'final';
    if (detailed === 'Warmup' || detailed === 'Pre-Game') return 'upcoming';
    if (abs === 'Live') return 'live';
    if (abs === 'Final') return 'final';
    return 'upcoming';
  }

  function seriesTag(g) {
    const post = POSTSEASON[g.gameType];
    if (post) return `<span class="tag post">${post.short} · GM ${g.seriesGameNumber || 1}</span>`;
    if (g.gameType === 'S') return '<span class="tag">SPRING</span>';
    if (g.gameType === 'A') return '<span class="tag post">ALL-STAR</span>';
    if (g.doubleHeader !== 'N' && g.gameNumber === 2) return '<span class="tag">GM 2</span>';
    return '';
  }

  // "MIL wins 4-1" / "TB leads 3-2" / "Series tied 2-2" from the postseason series records
  function seriesStatus(g) {
    if (!POSTSEASON[g.gameType]) return '';
    const a = g.teams.away.leagueRecord;
    const h = g.teams.home.leagueRecord;
    if (!a || !h) return '';
    const toWin = Math.ceil((g.gamesInSeries || 7) / 2);
    if (a.wins === h.wins) return `SERIES TIED ${a.wins}-${h.wins}`;
    const [lead, lw, tw] = a.wins > h.wins
      ? [abbr(g.teams.away), a.wins, h.wins]
      : [abbr(g.teams.home), h.wins, a.wins];
    return `${lead} ${lw >= toWin ? 'WINS' : 'LEADS'} ${lw}-${tw}`;
  }

  function subtitleFor(games) {
    const types = new Set(games.map(g => g.gameType));
    if (types.size === 1) {
      const t = [...types][0];
      if (POSTSEASON[t]) return `MLB · ${POSTSEASON[t].long}`;
      if (t === 'S') return 'MLB · SPRING TRAINING';
      if (t === 'A') return 'MLB · ALL-STAR GAME';
    }
    if ([...types].some(t => POSTSEASON[t])) return 'MLB · POSTSEASON';
    return 'MLB · LIVE ACTIVE GAMES';
  }

  // --- Fetch + render ----------------------------------------
  let pollTimer = null;
  let fetchSeq = 0;

  async function fetchGames() {
    clearTimeout(pollTimer);
    const seq = ++fetchSeq;
    const date = boardDate();
    const url = `${API}?sportId=1&date=${date}&gameType=${GAME_TYPES}&hydrate=linescore,team,probablePitcher,decisions`;
    let next = POLL_IDLE;
    let ok = false;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (seq !== fetchSeq) return; // the day changed while this was in flight
      const games = (data.dates && data.dates[0] && data.dates[0].games) || [];
      if (games.length === 0) {
        await renderEmpty(date);
        next = POLL_EMPTY;
      } else {
        render(games);
        next = games.some(g => statusBucket(g) === 'live') ? POLL_LIVE : POLL_IDLE;
      }
      ok = true;
    } catch (err) {
      if (seq !== fetchSeq) return;
      console.error('Feed error:', err);
      const feed = document.getElementById('games');
      if (!feed.querySelector('.game, .empty')) {
        feed.innerHTML = `<div class="empty"><div><h2>Feed Unavailable</h2><div class="sub">Retrying…</div></div></div>`;
      }
      next = POLL_LIVE;
    }
    // A past archive date never changes; stop polling after the first good render.
    if (ok && dateOverride && dateOverride < toISO(new Date())) return;
    pollTimer = setTimeout(fetchGames, next);
  }

  function setCounts(live, final, upcoming) {
    document.getElementById('count-live').textContent = live;
    document.getElementById('count-final').textContent = final;
    document.getElementById('count-upcoming').textContent = upcoming;
  }

  function render(games) {
    // Sort: live > upcoming (by time) > final
    const bucketOrder = { live: 0, upcoming: 1, final: 2 };
    games.sort((a, b) => {
      const ba = bucketOrder[statusBucket(a)];
      const bb = bucketOrder[statusBucket(b)];
      if (ba !== bb) return ba - bb;
      return new Date(a.gameDate) - new Date(b.gameDate);
    });

    let liveCount = 0, finalCount = 0, upcomingCount = 0;
    games.forEach(g => {
      const b = statusBucket(g);
      if (b === 'live') liveCount++;
      else if (b === 'final') finalCount++;
      else upcomingCount++;
    });
    setCounts(liveCount, finalCount, upcomingCount);
    document.getElementById('subtitle').textContent = subtitleFor(games);

    lastGames = games;
    gameIndex.clear();
    games.forEach(g => gameIndex.set(g.gamePk, g));

    // Score changes are tracked across the whole slate so off-page games don't flash later
    const flashes = new Map();
    games.forEach(g => {
      const away = g.teams.away.score ?? 0, home = g.teams.home.score ?? 0;
      const prev = previousScores.get(g.gamePk);
      if (prev) flashes.set(g.gamePk, { away: prev.away !== away, home: prev.home !== home });
      previousScores.set(g.gamePk, { home, away });
    });

    const pages = Math.ceil(games.length / MAX_CARDS);
    currentPage = Math.min(currentPage, pages - 1);
    updatePager(pages);
    renderPage(flashes);
    document.getElementById('ticker-label').textContent = 'SCORES';
    updateTicker(games);
  }

  function updatePager(pages) {
    document.getElementById('pager').hidden = pages < 2;
    document.getElementById('page-num').textContent = `${currentPage + 1}/${pages}`;
  }

  function setPage(p) {
    const pages = Math.ceil(lastGames.length / MAX_CARDS);
    if (pages < 2) return;
    currentPage = (p + pages) % pages;
    updatePager(pages);
    renderPage(new Map());
  }

  function renderPage(flashes) {
    const games = lastGames;
    const visible = games.slice(currentPage * MAX_CARDS, (currentPage + 1) * MAX_CARDS);
    const feed = document.getElementById('games');
    feed.innerHTML = '';
    const currentKeys = new Set();

    visible.forEach((g, idx) => {
      currentKeys.add(g.gamePk);
      const bucket = statusBucket(g);
      const off = isOffState(g);
      const started = bucket === 'live' || (bucket === 'final' && !off) || (off && g.linescore?.currentInning);
      const home = g.teams.home;
      const away = g.teams.away;
      const ls = g.linescore || {};

      const homeRuns = home.score ?? 0;
      const awayRuns = away.score ?? 0;
      const homeHits = ls.teams?.home?.hits ?? '-';
      const awayHits = ls.teams?.away?.hits ?? '-';

      // Winner/loser styling on finals
      let homeClass = '', awayClass = '';
      if (bucket === 'final' && !off) {
        if (homeRuns > awayRuns) { homeClass = 'winner'; awayClass = 'loser'; }
        else if (awayRuns > homeRuns) { awayClass = 'winner'; homeClass = 'loser'; }
      }

      // Status + inning text
      let statusText = 'SCHEDULED';
      let inningText = formatGameTime(g);
      const detailed = g.status?.detailedState || '';
      if (bucket === 'live') {
        statusText = /Delay/.test(detailed) ? 'DELAYED' : 'LIVE';
        const inning = ls.currentInning || 1;
        const ord = `${inning}${inningSuffix(inning)}`;
        if (ls.inningState === 'Middle') inningText = `MID ${ord}`;
        else if (ls.inningState === 'End') inningText = `END ${ord}`;
        else inningText = `${ls.inningHalf === 'Top' ? '▲' : '▼'} ${ord}`;
      } else if (off) {
        statusText = detailed.split(':')[0].toUpperCase();
        inningText = started ? `${ls.inningHalf === 'Top' ? '▲' : '▼'} ${ls.currentInning}` : '';
      } else if (bucket === 'final') {
        statusText = 'FINAL';
        const sched = ls.scheduledInnings || 9;
        inningText = ls.currentInning && ls.currentInning !== sched ? `F/${ls.currentInning}` : 'F';
      } else if (detailed === 'Warmup') {
        statusText = 'WARMUP';
      }

      // Footer: bases/outs/count when live, pitchers otherwise, series status in the postseason
      let footerHtml = '';
      const series = seriesStatus(g);
      const seriesLine = series ? `<div class="series">${series}</div>` : '';
      if (bucket === 'live') {
        // Between half-innings the feed still reports the last out and runners; show a clean slate
        const midBreak = ls.inningState === 'Middle' || ls.inningState === 'End';
        const outs = midBreak ? 0 : (ls.outs ?? 0);
        const bases = midBreak ? {} : (ls.offense || {});
        const showCount = !midBreak;
        footerHtml = `
          <div class="pitcher-info">${seriesLine}</div>
          <div class="diamond-wrap">
            ${showCount ? `<div class="count">${ls.balls ?? 0}-${ls.strikes ?? 0}</div>` : ''}
            <div class="diamond">
              <div class="base second ${bases.second ? 'on' : ''}"></div>
              <div class="base first ${bases.first ? 'on' : ''}"></div>
              <div class="base third ${bases.third ? 'on' : ''}"></div>
            </div>
            <div class="outs">
              <div class="out ${outs >= 1 ? 'on' : ''}"></div>
              <div class="out ${outs >= 2 ? 'on' : ''}"></div>
              <div class="out ${outs >= 3 ? 'on' : ''}"></div>
            </div>
          </div>`;
      } else if (bucket === 'upcoming') {
        const awayP = away.probablePitcher?.fullName;
        const homeP = home.probablePitcher?.fullName;
        const pitchers = (awayP || homeP) ? `<div>${lastName(awayP)} vs ${lastName(homeP)}</div>` : '';
        if (pitchers || seriesLine) footerHtml = `<div class="pitcher-info">${seriesLine}${pitchers}</div>`;
      } else if (!off) {
        const w = g.decisions?.winner?.fullName;
        const l = g.decisions?.loser?.fullName;
        const sv = g.decisions?.save?.fullName;
        const dec = w
          ? `<div><span class="label">W</span>${lastName(w)}  <span class="label">L</span>${lastName(l)}${sv ? `  <span class="label">S</span>${lastName(sv)}` : ''}</div>`
          : '';
        if (dec || seriesLine) footerHtml = `<div class="pitcher-info">${seriesLine}${dec}</div>`;
      }

      const recordText = side => side.leagueRecord ? `${side.leagueRecord.wins}-${side.leagueRecord.losses}` : '';
      const metaText = side => {
        const rec = recordText(side);
        return POSTSEASON[g.gameType] ? rec && `${rec} IN SERIES` : rec;
      };

      const card = document.createElement('div');
      card.className = `game ${bucket}${started ? ' clickable' : ''}`;
      card.dataset.gamepk = g.gamePk;
      if (!previousGameKeys.has(g.gamePk)) {
        card.classList.add('game-enter');
        card.style.animationDelay = `${idx * 40}ms`;
      }

      const teamRow = (side, cls, which, runs, hits) => `
          <div class="team-row ${cls}">
            <div class="logo"><img src="${logoUrl(side.team.id)}" alt="${side.team.name}" onerror="this.style.display='none'"/></div>
            <div>
              <div class="team-name">${side.team.teamName || side.team.name}</div>
              <div class="team-meta">${[metaText(side), which].filter(Boolean).join(' · ')}</div>
            </div>
            <div class="score" data-team="${which.toLowerCase()}">${started ? runs : ''}</div>
            <div class="hits">${started && hits !== '-' ? `${hits}<small>H</small>` : ''}</div>
          </div>`;

      card.innerHTML = `
        <div class="game-header">
          <div class="status"><span class="dot"></span>${statusText}</div>
          ${seriesTag(g)}
          <div class="inning-info">${inningText}</div>
        </div>
        <div class="teams">
          ${teamRow(away, awayClass, 'AWAY', awayRuns, awayHits)}
          ${teamRow(home, homeClass, 'HOME', homeRuns, homeHits)}
        </div>
        <div class="game-footer">
          ${footerHtml || '<div></div>'}
        </div>
      `;

      feed.appendChild(card);

      // Flash scores that changed since last poll
      const flash = flashes.get(g.gamePk);
      if (flash && flash.away) card.querySelector('[data-team="away"]').classList.add('flash');
      if (flash && flash.home) card.querySelector('[data-team="home"]').classList.add('flash');
    });

    previousGameKeys = currentKeys;
  }

  function updateTicker(games) {
    const items = games.map(g => {
      const bucket = statusBucket(g);
      const away = g.teams.away;
      const home = g.teams.home;
      let statusLabel;
      if (isOffState(g)) {
        statusLabel = (g.status.detailedState || '').split(':')[0].toUpperCase();
      } else if (bucket === 'live') {
        const half = g.linescore?.inningHalf === 'Top' ? '▲' : '▼';
        statusLabel = `${half}${g.linescore?.currentInning || 1}`;
      } else if (bucket === 'final') {
        statusLabel = 'F';
      } else {
        statusLabel = formatGameTime(g);
      }
      const showScore = bucket !== 'upcoming' && !(isOffState(g) && !g.linescore?.currentInning);
      return `<div class="ticker-item">
        <span class="team-abbr">${abbr(away)}</span> <span class="score-val">${showScore ? away.score ?? '0' : ''}</span>
        <span class="separator">@</span>
        <span class="team-abbr">${abbr(home)}</span> <span class="score-val">${showScore ? home.score ?? '0' : ''}</span>
        <span class="separator">·</span> ${statusLabel}
      </div>`;
    }).join('');
    setTicker(items, games.length);
  }

  // Duplicate the track for a seamless loop; keep the scroll speed constant regardless of length
  function setTicker(itemsHtml, count) {
    const track = document.getElementById('ticker');
    track.innerHTML = itemsHtml + itemsHtml;
    track.style.animationDuration = `${Math.max(30, count * 7)}s`;
  }

  // --- Empty / offseason ---------------------------------------
  // Next game day(s) and the most recent World Series result. Cached per board date.
  async function loadOffseason(date) {
    if (offseasonCache.date === date) return offseasonCache.data;

    const nextUrl = `${API}?sportId=1&startDate=${addDays(date, 1)}&endDate=${addDays(date, LOOKAHEAD_DAYS)}` +
      `&gameType=${GAME_TYPES}&fields=dates,date,totalGames,games,gameType`;
    const wsUrl = `${API}?sportId=1&startDate=${addDays(date, -150)}&endDate=${date}&gameType=W&hydrate=team` +
      `&fields=dates,date,games,status,abstractGameState,teams,away,home,team,id,name,abbreviation,teamName,leagueRecord,wins,losses`;

    const [nextRes, wsRes] = await Promise.all([fetch(nextUrl), fetch(wsUrl)]);
    const nextData = nextRes.ok ? await nextRes.json() : { dates: [] };
    const wsData = wsRes.ok ? await wsRes.json() : { dates: [] };

    const dates = nextData.dates || [];
    const nextDay = dates[0] || null;
    const springStart = dates.find(d => d.games.some(g => g.gameType === 'S')) || null;
    const openingDay = dates.find(d => d.games.some(g => g.gameType === 'R')) || null;

    // Champion = winner of the last completed World Series game, if that team reached 4 wins
    let champ = null;
    const wsDates = wsData.dates || [];
    const lastWs = wsDates.length ? wsDates[wsDates.length - 1].games.slice(-1)[0] : null;
    if (lastWs && lastWs.status.abstractGameState === 'Final') {
      const a = lastWs.teams.away, h = lastWs.teams.home;
      const [w, l] = a.leagueRecord.wins > h.leagueRecord.wins ? [a, h] : [h, a];
      if (w.leagueRecord.wins >= 4) {
        champ = {
          team: w.team,
          loser: l.team,
          record: `${w.leagueRecord.wins}-${l.leagueRecord.wins}`,
          year: wsDates[wsDates.length - 1].date.slice(0, 4)
        };
      }
    }

    const data = { nextDay, springStart, openingDay, champ };
    offseasonCache = { date, data };
    return data;
  }

  const gamesWord = n => `${n} ${n === 1 ? 'GAME' : 'GAMES'}`;

  function nextLabel(day) {
    const types = new Set(day.games.map(g => g.gameType));
    if (types.has('R')) return 'REGULAR SEASON';
    if (types.has('S')) return 'SPRING TRAINING';
    if (types.has('A')) return 'ALL-STAR GAME';
    const post = [...types].map(t => POSTSEASON[t]).find(Boolean);
    return post ? post.long.toUpperCase() : 'GAMES';
  }

  async function renderEmpty(date) {
    setCounts(0, 0, 0);
    previousGameKeys = new Set();
    lastGames = [];
    gameIndex.clear();
    updatePager(0);
    const feed = document.getElementById('games');
    const { nextDay, springStart, openingDay, champ } = await loadOffseason(date);

    const gap = nextDay ? daysBetween(date, nextDay.date) : null;
    const offseason = gap === null || gap > 7;
    const dayWord = dateOverride ? 'This Day' : 'Today';

    document.getElementById('subtitle').textContent = offseason ? 'MLB · OFFSEASON' : 'MLB · LIVE ACTIVE GAMES';

    const champHtml = (offseason && champ) ? `
      <div class="champ">
        <div class="logo"><img src="${logoUrl(champ.team.id)}" alt="${champ.team.name}" onerror="this.style.display='none'"/></div>
        <div>
          <div class="label">${champ.year} World Series Champions</div>
          <div class="name">${champ.team.name}</div>
          <div class="result">Def. ${champ.loser.name} ${champ.record}</div>
        </div>
      </div>` : '';

    const countdown = (day, what) => {
      const n = daysBetween(date, day.date);
      return `
        <div class="countdown">
          <div class="days">${n}<small>${n === 1 ? 'DAY' : 'DAYS'}</small></div>
          <div class="what">${what}</div>
          <div class="when">${prettyDate(day.date)} · ${gamesWord(day.totalGames)}</div>
        </div>`;
    };

    let countdowns = '';
    if (offseason) {
      if (springStart) countdowns += countdown(springStart, 'Spring Training');
      if (openingDay) countdowns += countdown(openingDay, 'Opening Day');
      if (!countdowns && nextDay) countdowns += countdown(nextDay, nextLabel(nextDay));
    } else if (nextDay) {
      countdowns = countdown(nextDay, `Next: ${nextLabel(nextDay)}`);
    }

    feed.innerHTML = `
      <div class="empty">
        <div>
          <div class="eyebrow">${offseason ? `No Games ${dayWord}` : prettyDate(date, { weekday: 'long', month: 'long', day: 'numeric' })}</div>
          <h2>${offseason ? 'The <em>Offseason</em>' : `No Games <em>${dayWord}</em>`}</h2>
          ${!nextDay ? '<div class="sub">Schedule not yet posted.</div>' : ''}
        </div>
        ${champHtml}
        ${countdowns ? `<div class="countdowns">${countdowns}</div>` : ''}
      </div>`;

    // Ticker
    const bits = [];
    if (offseason && champ) bits.push(`<span class="team-abbr">${champ.year} WORLD SERIES</span><span class="separator">·</span>${champ.team.abbreviation} def. ${champ.loser.abbreviation} <span class="score-val">${champ.record}</span>`);
    if (offseason && springStart) bits.push(`<span class="team-abbr">SPRING TRAINING</span><span class="separator">·</span>${prettyDate(springStart.date)}`);
    if (offseason && openingDay) bits.push(`<span class="team-abbr">OPENING DAY</span><span class="separator">·</span>${prettyDate(openingDay.date)}`);
    if (!offseason && nextDay) bits.push(`<span class="team-abbr">NEXT GAMES</span><span class="separator">·</span>${prettyDate(nextDay.date)} · ${gamesWord(nextDay.totalGames)}`);
    if (!bits.length) bits.push('NO GAMES SCHEDULED');
    document.getElementById('ticker-label').textContent = offseason ? 'OFFSEASON' : 'SCHEDULE';
    setTicker(bits.map(b => `<div class="ticker-item">${b}</div>`).join(''), bits.length * 3);
  }

  // --- Box score -----------------------------------------------
  const GAME_API = 'https://statsapi.mlb.com/api/v1/game';
  const boxEl = document.getElementById('box');
  let boxPk = null;
  let boxTimer = null;

  function openBox(pk) {
    boxPk = pk;
    boxEl.innerHTML = '<div class="box-msg">LOADING BOX SCORE…</div>';
    boxEl.classList.add('open');
    loadBox();
  }

  function closeBox() {
    boxPk = null;
    clearTimeout(boxTimer);
    boxEl.classList.remove('open');
    boxEl.innerHTML = '';
  }

  async function loadBox() {
    const pk = boxPk;
    if (!pk) return;
    clearTimeout(boxTimer);
    try {
      const [bx, ls] = await Promise.all([
        fetch(`${GAME_API}/${pk}/boxscore`).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
        fetch(`${GAME_API}/${pk}/linescore`).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      ]);
      if (pk !== boxPk) return;
      const scroll = boxEl.scrollTop;
      boxEl.innerHTML = boxHtml(gameIndex.get(pk), bx, ls);
      boxEl.scrollTop = scroll;
    } catch (err) {
      if (pk !== boxPk) return;
      console.error('Box score error:', err);
      boxEl.innerHTML = '<div class="box-top"><button class="nav-btn" data-close>Close ✕</button></div><div class="box-msg">BOX SCORE UNAVAILABLE</div>';
    }
    // Keep a live game's box current
    const g = gameIndex.get(pk);
    if (pk === boxPk && g && statusBucket(g) === 'live') boxTimer = setTimeout(loadBox, POLL_LIVE);
  }

  const dash = v => (v === undefined || v === null || v === '') ? '-' : v;

  function boxHtml(g, bx, ls) {
    const sides = ['away', 'home'];
    const team = side => bx.teams[side].team;
    const teamAbbr = side => team(side).abbreviation || (g ? abbr(g.teams[side]) : team(side).name);
    const isFinal = g ? statusBucket(g) === 'final' : false;

    // Status line
    let status = g ? (g.status.detailedState || '') : '';
    const live = g && statusBucket(g) === 'live';
    if (live) status = `${ls.inningState || ''} ${ls.currentInningOrdinal || ''}`.trim();
    else if (isFinal && ls.currentInning && ls.currentInning !== (ls.scheduledInnings || 9)) status += ` · ${ls.currentInning} INN`;

    // Line score
    const innings = ls.innings || [];
    const n = Math.max(ls.scheduledInnings || 9, innings.length);
    let lsHead = '<th></th>';
    for (let i = 1; i <= n; i++) lsHead += `<th>${i}</th>`;
    lsHead += '<th class="rhe first">R</th><th class="rhe">H</th><th class="rhe">E</th>';
    const lsRow = side => {
      let cells = `<td class="team"><span><img src="${logoUrl(team(side).id)}" alt="" onerror="this.style.display='none'"/>${teamAbbr(side)}</span></td>`;
      for (let i = 0; i < n; i++) {
        const inn = innings[i];
        let v = inn && inn[side] ? inn[side].runs : undefined;
        // Home team didn't need its last at-bat
        if (v === undefined && side === 'home' && isFinal && inn) v = 'X';
        cells += `<td>${v ?? ''}</td>`;
      }
      const t = ls.teams?.[side] || {};
      cells += `<td class="rhe first">${t.runs ?? 0}</td><td class="rhe">${t.hits ?? 0}</td><td class="rhe">${t.errors ?? 0}</td>`;
      return `<tr>${cells}</tr>`;
    };

    // Decisions + game info
    const dec = g?.decisions || {};
    const decHtml = ['winner:W', 'loser:L', 'save:S']
      .map(k => k.split(':'))
      .filter(([key]) => dec[key])
      .map(([key, l]) => `<span class="dec">${l}</span>${dec[key].fullName}`)
      .join('&nbsp;&nbsp;&nbsp;');
    const info = (bx.info || []).filter(f => ['First pitch', 'T', 'Att', 'Weather', 'Wind'].includes(f.label));
    const infoHtml = info.map(f => `<b>${f.label === 'T' ? 'Time' : f.label}:</b> ${String(f.value || '').replace(/\.$/, '')}`).join('&nbsp;&nbsp;·&nbsp;&nbsp;');
    const venue = g?.venue?.name ? `<b>${g.venue.name}</b>` : '';

    const teamCol = side => {
      const t = bx.teams[side];
      const players = id => t.players['ID' + id];

      const batters = (t.batters || []).map(players).filter(p => p && p.battingOrder);
      const batRows = batters.map(p => {
        const s = p.stats.batting || {};
        const pos = (p.allPositions || [p.position]).map(x => x.abbreviation).join('-');
        const sub = Number(p.battingOrder) % 100 !== 0;
        return `<tr class="${sub ? 'sub' : ''}">
          <td>${p.person.boxscoreName || lastName(p.person.fullName)}<span class="pos">${pos}</span></td>
          <td>${dash(s.atBats)}</td><td>${dash(s.runs)}</td><td>${dash(s.hits)}</td><td>${dash(s.rbi)}</td>
          <td>${dash(s.baseOnBalls)}</td><td>${dash(s.strikeOuts)}</td>
          <td class="season">${dash(p.seasonStats?.batting?.avg)}</td></tr>`;
      }).join('');
      const tb = t.teamStats?.batting || {};
      const batTotal = `<tr class="total"><td>Totals</td><td>${dash(tb.atBats)}</td><td>${dash(tb.runs)}</td><td>${dash(tb.hits)}</td><td>${dash(tb.rbi)}</td><td>${dash(tb.baseOnBalls)}</td><td>${dash(tb.strikeOuts)}</td><td></td></tr>`;

      const pitchRows = (t.pitchers || []).map(players).filter(Boolean).map(p => {
        const s = p.stats.pitching || {};
        return `<tr>
          <td>${p.person.boxscoreName || lastName(p.person.fullName)}${s.note ? `<span class="note">${s.note}</span>` : ''}</td>
          <td>${dash(s.inningsPitched)}</td><td>${dash(s.hits)}</td><td>${dash(s.runs)}</td><td>${dash(s.earnedRuns)}</td>
          <td>${dash(s.baseOnBalls)}</td><td>${dash(s.strikeOuts)}</td><td>${dash(s.homeRuns)}</td><td>${s.numberOfPitches ? s.numberOfPitches : '-'}</td>
          <td class="season">${dash(p.seasonStats?.pitching?.era)}</td></tr>`;
      }).join('');

      // Extra-base hits, homers, steals, errors from the box notes
      const keep = ['2B', '3B', 'HR', 'SB', 'E'];
      const notes = (t.info || []).flatMap(sec => sec.fieldList || [])
        .filter(f => keep.includes(f.label))
        .map(f => `<b>${f.label}:</b> ${f.value}`).join(' ');

      return `
        <div class="box-team">
          <h3><img src="${logoUrl(team(side).id)}" alt="" onerror="this.style.display='none'"/>${team(side).name}</h3>
          <table class="stats">
            <tr><th>Batting</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>K</th><th>AVG</th></tr>
            ${batRows || '<tr><td colspan="8">Lineup not posted</td></tr>'}
            ${batRows ? batTotal : ''}
          </table>
          <table class="stats">
            <tr><th>Pitching</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th><th>HR</th><th>PC</th><th>ERA</th></tr>
            ${pitchRows || '<tr><td colspan="10">-</td></tr>'}
          </table>
          ${notes ? `<div class="box-notes">${notes}</div>` : ''}
        </div>`;
    };

    const title = `${team('away').teamName || team('away').name} at ${team('home').teamName || team('home').name}`;
    const hasLines = sides.some(side => (bx.teams[side].batters || []).length);

    return `
      <div class="box-top">
        <div class="box-title">${title}</div>
        <div class="box-status ${live ? 'live' : ''}">${status}</div>
        ${g ? seriesTag(g) : ''}
        <button class="nav-btn" data-close>Close ✕</button>
      </div>
      <div class="box-head">
        <table class="ls">
          <tr>${lsHead}</tr>
          ${lsRow('away')}
          ${lsRow('home')}
        </table>
        <div class="box-info">
          ${decHtml ? `<div>${decHtml}</div>` : ''}
          ${g && seriesStatus(g) ? `<div><b>${seriesStatus(g)}</b></div>` : ''}
          ${venue ? `<div>${venue}</div>` : ''}
          ${infoHtml ? `<div>${infoHtml}</div>` : ''}
        </div>
      </div>
      ${hasLines
        ? `<div class="box-cols">${sides.map(teamCol).join('')}</div>`
        : '<div class="box-msg">NO BATTING OR PITCHING LINES ON RECORD FOR THIS GAME</div>'}`;
  }

  // --- Calendar -----------------------------------------------
  const calEl = document.getElementById('cal');
  const monthCounts = new Map();     // 'YYYY-MM' -> {date: totalGames}
  let calMonth = null;               // 'YYYY-MM' currently shown

  function openCal() {
    calMonth = boardDate().slice(0, 7);
    calEl.classList.add('open');
    renderCal();
  }

  function closeCal() {
    calEl.classList.remove('open');
  }

  async function monthGameCounts(ym) {
    if (monthCounts.has(ym)) return monthCounts.get(ym);
    const [y, m] = ym.split('-').map(Number);
    const last = new Date(y, m, 0).getDate();
    const url = `${API}?sportId=1&startDate=${ym}-01&endDate=${ym}-${pad(last)}&gameType=${GAME_TYPES}&fields=dates,date,totalGames`;
    const counts = {};
    try {
      const data = await (await fetch(url)).json();
      (data.dates || []).forEach(d => { counts[d.date] = d.totalGames; });
      monthCounts.set(ym, counts);
    } catch (err) {
      console.error('Calendar error:', err);
    }
    return counts;
  }

  function shiftMonth(ym, n) {
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 1 + n, 1);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  }

  async function renderCal() {
    const ym = calMonth;
    const [y, m] = ym.split('-').map(Number);
    const firstYear = Number(FIRST_DATE.slice(0, 4));
    const lastYear = new Date().getFullYear() + 1;
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    let years = '';
    for (let yr = lastYear; yr >= firstYear; yr--) years += `<option value="${yr}" ${yr === y ? 'selected' : ''}>${yr}</option>`;
    const months = monthNames.map((n, i) => `<option value="${i + 1}" ${i + 1 === m ? 'selected' : ''}>${n}</option>`).join('');

    const draw = counts => {
      const start = new Date(y, m - 1, 1).getDay();
      const days = new Date(y, m, 0).getDate();
      const today = todayBoardDate();
      const selected = boardDate();
      let cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="cal-dow">${d}</div>`).join('');
      for (let i = 0; i < start; i++) cells += '<div></div>';
      for (let d = 1; d <= days; d++) {
        const iso = `${ym}-${pad(d)}`;
        const n = counts ? counts[iso] : undefined;
        const cls = ['cal-day', counts && !n ? 'none' : '', iso === today ? 'today' : '', iso === selected ? 'selected' : ''].join(' ');
        const label = counts ? (n ? `${n} G` : '·') : '';
        cells += `<button class="${cls}" data-date="${iso}" ${iso < FIRST_DATE ? 'disabled' : ''}>${d}<small>${label}</small></button>`;
      }
      calEl.innerHTML = `
        <div class="cal-head">
          <button class="nav-btn arrow" data-month="-1" aria-label="Previous month" ${ym <= FIRST_DATE.slice(0, 7) ? 'disabled' : ''}>‹</button>
          <select id="cal-m" aria-label="Month">${months}</select>
          <select id="cal-y" aria-label="Year">${years}</select>
          <button class="nav-btn arrow" data-month="1" aria-label="Next month">›</button>
          <div class="spacer"></div>
          <button class="nav-btn" data-cal-close aria-label="Close calendar">✕</button>
        </div>
        <div class="cal-grid">${cells}</div>
        <div class="cal-foot"><span>Number = games that day</span><span>Back to ${monthNames[3]} 18, ${firstYear}</span></div>`;
    };

    draw(monthCounts.get(ym) || null);
    if (!monthCounts.has(ym)) {
      const counts = await monthGameCounts(ym);
      if (calMonth === ym && calEl.classList.contains('open')) draw(counts);
    }
  }

  calEl.addEventListener('click', e => {
    const day = e.target.closest('[data-date]');
    const mon = e.target.closest('[data-month]');
    if (day && !day.disabled) { closeCal(); goToDate(day.dataset.date); }
    else if (mon && !mon.disabled) { calMonth = shiftMonth(calMonth, Number(mon.dataset.month)); renderCal(); }
    else if (e.target.closest('[data-cal-close]')) closeCal();
  });

  calEl.addEventListener('change', () => {
    const y = document.getElementById('cal-y').value;
    const m = document.getElementById('cal-m').value;
    calMonth = `${y}-${pad(m)}`;
    if (calMonth < FIRST_DATE.slice(0, 7)) calMonth = FIRST_DATE.slice(0, 7);
    renderCal();
  });

  document.getElementById('cal-btn').addEventListener('click', e => {
    e.stopPropagation();
    calEl.classList.contains('open') ? closeCal() : openCal();
  });

  // Click outside the calendar closes it
  document.addEventListener('click', e => {
    if (calEl.classList.contains('open') && !calEl.contains(e.target) && !e.target.closest('#cal-btn')) closeCal();
  });

  // --- Navigation ---------------------------------------------
  function goToDate(iso, push = true) {
    if (iso < FIRST_DATE) iso = FIRST_DATE;
    dateOverride = iso === todayBoardDate() ? null : iso;
    if (push) {
      const url = new URL(location.href);
      if (dateOverride) url.searchParams.set('date', dateOverride);
      else url.searchParams.delete('date');
      history.pushState(null, '', url);
    }
    closeBox();
    previousScores.clear();
    previousGameKeys = new Set();
    currentPage = 0;
    updateClock();
    document.getElementById('games').innerHTML = '<div class="loading">LOADING…</div>';
    fetchGames();
  }

  window.addEventListener('popstate', () => goToDate(dateFromUrl() || todayBoardDate(), false));

  document.getElementById('day-prev').addEventListener('click', () => goToDate(addDays(boardDate(), -1)));
  document.getElementById('day-next').addEventListener('click', () => goToDate(addDays(boardDate(), 1)));
  document.getElementById('day-today').addEventListener('click', () => goToDate(todayBoardDate()));
  document.getElementById('pager').addEventListener('click', e => {
    const b = e.target.closest('[data-page]');
    if (b) setPage(currentPage + Number(b.dataset.page));
  });

  document.getElementById('games').addEventListener('click', e => {
    const card = e.target.closest('.game.clickable');
    if (card) openBox(Number(card.dataset.gamepk));
  });

  boxEl.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) closeBox();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeCal(); closeBox(); }
    else if (boxPk || calEl.classList.contains('open') || e.target.tagName === 'SELECT') return;
    else if (e.key === 'ArrowLeft') goToDate(addDays(boardDate(), -1));
    else if (e.key === 'ArrowRight') goToDate(addDays(boardDate(), 1));
    else if (e.key === 'PageDown') setPage(currentPage + 1);
    else if (e.key === 'PageUp') setPage(currentPage - 1);
  });

  ['pointerdown', 'keydown', 'wheel'].forEach(ev =>
    document.addEventListener(ev, () => { lastInteraction = Date.now(); }, { passive: true }));

  // Heavy days: rotate pages when the board is unattended
  setInterval(() => {
    if (!boxPk && !calEl.classList.contains('open') && Date.now() - lastInteraction > IDLE_BEFORE_ROTATE) setPage(currentPage + 1);
  }, PAGE_ROTATE);

  // --- Boot + poll --------------------------------------------
  fetchGames();
</script>
</body>
</html>
