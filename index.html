<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Katz Konnection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --panel: #10151c;
    --panel-2: #151c26;
    --line: rgba(255,255,255,0.06);
    --text: #ffffff;
    --dim: #8a94a6;
    --live: #ff3b3b;
    --final: #6b7280;
    --upcoming: #f4b942;
    --diamond-on: #ffd84a;
    --diamond-off: rgba(255,255,255,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Archivo', sans-serif;
    overflow: hidden;
  }

  /* 1920x1080 stage, scaled to viewport */
  #stage-wrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 0%, rgba(255,59,59,0.06), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(244,185,66,0.04), transparent 40%),
      var(--bg);
  }

  #stage {
    width: 1920px;
    height: 1080px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    display: grid;
    grid-template-rows: 120px 1fr 50px;
    padding: 32px 48px;
    gap: 20px;
  }

  /* Header */
  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 32px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .brand-mark {
    width: 72px;
    height: 72px;
    border-radius: 14px;
    background: linear-gradient(135deg, #ff3b3b 0%, #b80d0d 100%);
    display: grid;
    place-items: center;
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 38px;
    letter-spacing: -2px;
    box-shadow: 0 10px 40px rgba(255,59,59,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .brand-text .title {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 44px;
    letter-spacing: -1.5px;
    line-height: 0.9;
    text-transform: uppercase;
  }

  .brand-text .title em {
    font-style: normal;
    color: var(--live);
  }

  .brand-text .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .header-center {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .stat-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 24px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    min-width: 110px;
  }

  .stat-chip .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .stat-chip .value {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 32px;
    line-height: 1;
    margin-top: 4px;
  }

  .stat-chip.live .value { color: var(--live); }
  .stat-chip.final .value { color: var(--dim); }
  .stat-chip.upcoming .value { color: var(--upcoming); }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .clock {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 36px;
    line-height: 1;
    letter-spacing: -0.5px;
  }

  .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .date .archive { color: var(--upcoming); }

  /* Grid of games */
  #games {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 14px;
    align-content: start;
    overflow: hidden;
    min-height: 0;
  }

  .game {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 18px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 6px;
    min-height: 0;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }

  .game::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--final);
    transition: background 0.3s ease;
  }

  .game.live::before { background: var(--live); box-shadow: 0 0 20px var(--live); }
  .game.upcoming::before { background: var(--upcoming); }
  .game.live { border-color: rgba(255,59,59,0.25); }

  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--final);
  }

  .game.live .status .dot {
    background: var(--live);
    animation: pulse 1.4s ease-in-out infinite;
  }

  .game.live .status { color: var(--live); }
  .game.upcoming .status { color: var(--upcoming); }
  .game.upcoming .status .dot { background: var(--upcoming); }
  .game.final .status { color: var(--dim); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px 7px;
    margin-left: auto;
    white-space: nowrap;
  }

  .tag.post { color: var(--diamond-on); border-color: rgba(255,216,74,0.3); }

  .inning-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .game.live .inning-info { color: var(--text); font-weight: 700; }

  .teams {
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    align-content: center;
  }

  .team-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 2px 4px;
  }

  .team-row.winner .team-name { color: var(--text); }
  .team-row.loser .team-name,
  .team-row.loser .score,
  .team-row.loser .hits { color: var(--dim); }

  .logo {
    width: 34px;
    height: 34px;
    border-radius: 6px;
    background: var(--panel-2);
    display: grid;
    place-items: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }

  .team-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    line-height: 1;
  }

  .team-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .score {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 36px;
    line-height: 1;
    min-width: 48px;
    text-align: right;
    transition: color 0.3s ease;
  }

  .score.flash {
    animation: scoreFlash 0.8s ease-out;
  }

  @keyframes scoreFlash {
    0%   { color: #ffd84a; text-shadow: 0 0 20px #ffd84a; transform: scale(1.15); }
    100% { color: var(--text); text-shadow: none; transform: scale(1); }
  }

  .hits {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--dim);
    min-width: 34px;
    text-align: right;
  }

  .hits small { font-size: 9px; margin-left: 2px; letter-spacing: 1px; }

  .game-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-top: 6px;
    border-top: 1px solid var(--line);
    min-height: 38px;
  }

  /* Diamond (bases) */
  .diamond-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Bases drawn as individually rotated squares so the diamond stays inside the 26px footer row */
  .diamond {
    width: 40px;
    height: 26px;
    position: relative;
  }

  .base {
    position: absolute;
    width: 10px;
    height: 10px;
    transform: rotate(45deg);
    background: var(--diamond-off);
    border: 1px solid rgba(255,255,255,0.2);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  .base.on {
    background: var(--diamond-on);
    box-shadow: 0 0 12px var(--diamond-on);
  }

  .base.first { right: 2px; top: 13px; }
  .base.second { left: 15px; top: 2px; }
  .base.third { left: 2px; top: 13px; }

  .outs {
    display: flex;
    gap: 4px;
  }

  .out {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--diamond-off);
    border: 1px solid rgba(255,255,255,0.2);
  }

  .out.on { background: var(--diamond-on); }

  .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 1px;
  }

  .pitcher-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.5px;
    line-height: 1.5;
  }

  .pitcher-info .label {
    color: var(--live);
    font-weight: 700;
    margin-right: 4px;
  }

  .pitcher-info .series { color: var(--diamond-on); font-weight: 700; }

  /* Footer ticker */
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 20px;
    overflow: hidden;
  }

  .ticker-label {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--live);
    padding-right: 20px;
    border-right: 1px solid var(--line);
    margin-right: 20px;
    flex-shrink: 0;
  }

  .ticker-viewport {
    flex: 1;
    overflow: hidden;
    position: relative;
    height: 50px;
    display: flex;
    align-items: center;
  }

  .ticker-track {
    display: flex;
    gap: 40px;
    padding-right: 40px;
    white-space: nowrap;
    animation: ticker 90s linear infinite;
  }

  .ticker-item {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text);
    letter-spacing: 0.5px;
  }

  .ticker-item .separator { color: var(--live); margin: 0 10px; }
  .ticker-item .team-abbr { font-weight: 700; }
  .ticker-item .score-val { color: #ffd84a; font-weight: 700; }

  @keyframes ticker {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* Empty / offseason state */
  .empty {
    grid-column: 1 / -1;
    grid-row: 1 / -1;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    text-align: center;
    font-family: 'Archivo', sans-serif;
    color: var(--dim);
  }

  .empty .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 14px;
  }

  .empty h2 {
    font-size: 96px;
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -3px;
    text-transform: uppercase;
    color: var(--text);
  }

  .empty h2 em { font-style: normal; color: var(--live); }

  .empty .sub {
    font-size: 22px;
    margin-top: 16px;
  }

  .champ {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 24px 40px 24px 28px;
    background: var(--panel);
    border: 1px solid rgba(255,216,74,0.25);
    border-radius: 14px;
    position: relative;
    overflow: hidden;
  }

  .champ::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--diamond-on);
    box-shadow: 0 0 20px var(--diamond-on);
  }

  .champ .logo { width: 96px; height: 96px; border-radius: 12px; }

  .champ .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--diamond-on);
    text-transform: uppercase;
    text-align: left;
  }

  .champ .name {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 48px;
    line-height: 1.1;
    text-transform: uppercase;
    color: var(--text);
    text-align: left;
  }

  .champ .result {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-align: left;
    text-transform: uppercase;
  }

  .countdowns {
    display: flex;
    gap: 20px;
  }

  .countdown {
    min-width: 340px;
    padding: 22px 32px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  .countdown .days {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1;
    color: var(--upcoming);
  }

  .countdown .days small {
    font-size: 22px;
    color: var(--dim);
    margin-left: 6px;
    letter-spacing: 1px;
  }

  .countdown .what {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text);
    margin-top: 12px;
  }

  .countdown .when {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .loading {
    grid-column: 1 / -1;
    grid-row: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--dim);
    letter-spacing: 2px;
  }

  .game-enter {
    animation: gameIn 0.5s ease-out backwards;
  }

  @keyframes gameIn {
    0%   { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <header>
      <div class="brand">
        <div class="brand-mark">K</div>
        <div class="brand-text">
          <div class="title">THE KATZ <em>KONNECTION</em></div>
          <div class="subtitle" id="subtitle">MLB · LIVE ACTIVE GAMES</div>
        </div>
      </div>
      <div class="header-center">
        <div class="stat-chip live">
          <div class="label">Live</div>
          <div class="value" id="count-live">0</div>
        </div>
        <div class="stat-chip final">
          <div class="label">Final</div>
          <div class="value" id="count-final">0</div>
        </div>
        <div class="stat-chip upcoming">
          <div class="label">Upcoming</div>
          <div class="value" id="count-upcoming">0</div>
        </div>
      </div>
      <div class="header-right">
        <div class="clock" id="clock">-:--</div>
        <div class="date" id="date"></div>
      </div>
    </header>

    <section id="games">
      <div class="loading">LOADING LIVE FEED…</div>
    </section>

    <footer>
      <div class="ticker-label" id="ticker-label">SCORES</div>
      <div class="ticker-viewport">
        <div class="ticker-track" id="ticker">
          <div class="ticker-item">Connecting to feed…</div>
        </div>
      </div>
    </footer>
  </div>
</div>

<script>
  /* =========================================================
     THE KATZ KONNECTION: MLB Active Games Board
     Polls the MLB Stats API and re-renders itself.
     Fixed 1920x1080 stage, CSS-scaled to any viewport.

     URL params:
       ?date=YYYY-MM-DD   show a specific day (archive / testing)
     ========================================================= */

  const API = 'https://statsapi.mlb.com/api/v1/schedule';
  const GAME_TYPES = 'S,R,A,F,D,L,W'; // spring, regular, All-Star, postseason rounds
  const MAX_CARDS = 12;               // 3x4 grid on the 1080 stage
  const ROLLOVER_HOUR = 6;            // before 6am local, keep showing yesterday's slate
  const POLL_LIVE = 15 * 1000;        // any game in progress
  const POLL_IDLE = 60 * 1000;        // games today, none live
  const POLL_EMPTY = 30 * 60 * 1000;  // no games on the board date
  const LOOKAHEAD_DAYS = 200;         // far enough to reach spring training from October

  const POSTSEASON = {
    F: { short: 'WC', long: 'Wild Card' },
    D: { short: 'DS', long: 'Division Series' },
    L: { short: 'LCS', long: 'League Championship Series' },
    W: { short: 'WS', long: 'World Series' }
  };

  const params = new URLSearchParams(location.search);
  const dateOverride = /^\d{4}-\d{2}-\d{2}$/.test(params.get('date') || '') ? params.get('date') : null;

  // --- Responsive scale of the 1920x1080 stage ------------------
  function scaleStage() {
    const stage = document.getElementById('stage');
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  window.addEventListener('resize', scaleStage);
  scaleStage();

  // --- Date helpers -------------------------------------------
  const pad = n => String(n).padStart(2, '0');
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  // Local-midnight Date for a YYYY-MM-DD string (avoids the UTC shift of new Date('YYYY-MM-DD'))
  function fromISO(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function addDays(iso, n) {
    const d = fromISO(iso);
    d.setDate(d.getDate() + n);
    return toISO(d);
  }

  function daysBetween(fromIso, toIso) {
    return Math.round((fromISO(toIso) - fromISO(fromIso)) / 86400000);
  }

  function boardDate() {
    if (dateOverride) return dateOverride;
    const now = new Date();
    if (now.getHours() < ROLLOVER_HOUR) now.setDate(now.getDate() - 1);
    return toISO(now);
  }

  function prettyDate(iso, opts) {
    return fromISO(iso).toLocaleDateString('en-US', opts || { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
  }

  // --- Clock --------------------------------------------------
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    const iso = boardDate();
    const dateEl = document.getElementById('date');
    const label = prettyDate(iso, dateOverride
      ? { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }
      : undefined);
    dateEl.innerHTML = dateOverride ? `<span class="archive">ARCHIVE</span> · ${label}` : label;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // --- State --------------------------------------------------
  const previousScores = new Map(); // gamePk -> {home, away}
  let previousGameKeys = new Set();
  let offseasonCache = { date: null, data: null };

  // --- Helpers ------------------------------------------------
  function logoUrl(teamId) {
    return `https://www.mlbstatic.com/team-logos/${teamId}.svg`;
  }

  function formatGameTime(g) {
    if (g.status && g.status.startTimeTBD) return 'TIME TBD';
    return new Date(g.gameDate).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  }

  function inningSuffix(n) {
    if (n >= 11 && n <= 13) return 'th';
    const last = n % 10;
    if (last === 1) return 'st';
    if (last === 2) return 'nd';
    if (last === 3) return 'rd';
    return 'th';
  }

  function lastName(fullName) {
    if (!fullName) return 'TBD';
    const parts = fullName.split(' ');
    while (parts.length > 1 && /^(Jr\.?|Sr\.?|II|III|IV|V)$/.test(parts[parts.length - 1])) parts.pop();
    return parts[parts.length - 1];
  }

  function abbr(side) {
    return side.team.abbreviation || side.team.name.slice(0, 3).toUpperCase();
  }

  // Off-the-field states: postponed, cancelled, suspended. Sorted with finals, no winner styling.
  function isOffState(game) {
    return /Postponed|Cancelled|Suspended/.test(game.status?.detailedState || '');
  }

  function statusBucket(game) {
    const abs = game.status?.abstractGameState || '';
    const detailed = game.status?.detailedState || '';
    if (isOffState(game)) return 'final';
    if (detailed === 'Warmup' || detailed === 'Pre-Game') return 'upcoming';
    if (abs === 'Live') return 'live';
    if (abs === 'Final') return 'final';
    return 'upcoming';
  }

  function seriesTag(g) {
    const post = POSTSEASON[g.gameType];
    if (post) return `<span class="tag post">${post.short} · GM ${g.seriesGameNumber || 1}</span>`;
    if (g.gameType === 'S') return '<span class="tag">SPRING</span>';
    if (g.gameType === 'A') return '<span class="tag post">ALL-STAR</span>';
    if (g.doubleHeader !== 'N' && g.gameNumber === 2) return '<span class="tag">GM 2</span>';
    return '';
  }

  // "MIL wins 4-1" / "TB leads 3-2" / "Series tied 2-2" from the postseason series records
  function seriesStatus(g) {
    if (!POSTSEASON[g.gameType]) return '';
    const a = g.teams.away.leagueRecord;
    const h = g.teams.home.leagueRecord;
    if (!a || !h) return '';
    const toWin = Math.ceil((g.gamesInSeries || 7) / 2);
    if (a.wins === h.wins) return `SERIES TIED ${a.wins}-${h.wins}`;
    const [lead, lw, tw] = a.wins > h.wins
      ? [abbr(g.teams.away), a.wins, h.wins]
      : [abbr(g.teams.home), h.wins, a.wins];
    return `${lead} ${lw >= toWin ? 'WINS' : 'LEADS'} ${lw}-${tw}`;
  }

  function subtitleFor(games) {
    const types = new Set(games.map(g => g.gameType));
    if (types.size === 1) {
      const t = [...types][0];
      if (POSTSEASON[t]) return `MLB · ${POSTSEASON[t].long}`;
      if (t === 'S') return 'MLB · SPRING TRAINING';
      if (t === 'A') return 'MLB · ALL-STAR GAME';
    }
    if ([...types].some(t => POSTSEASON[t])) return 'MLB · POSTSEASON';
    return 'MLB · LIVE ACTIVE GAMES';
  }

  // --- Fetch + render ----------------------------------------
  let pollTimer = null;

  async function fetchGames() {
    const date = boardDate();
    const url = `${API}?sportId=1&date=${date}&gameType=${GAME_TYPES}&hydrate=linescore,team,probablePitcher,decisions`;
    let next = POLL_IDLE;
    let ok = false;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const games = (data.dates && data.dates[0] && data.dates[0].games) || [];
      if (games.length === 0) {
        await renderEmpty(date);
        next = POLL_EMPTY;
      } else {
        render(games);
        next = games.some(g => statusBucket(g) === 'live') ? POLL_LIVE : POLL_IDLE;
      }
      ok = true;
    } catch (err) {
      console.error('Feed error:', err);
      const feed = document.getElementById('games');
      if (!feed.querySelector('.game, .empty')) {
        feed.innerHTML = `<div class="empty"><div><h2>Feed Unavailable</h2><div class="sub">Retrying…</div></div></div>`;
      }
      next = POLL_LIVE;
    }
    // A past archive date never changes; stop polling after the first good render.
    if (ok && dateOverride && dateOverride < toISO(new Date())) return;
    clearTimeout(pollTimer);
    pollTimer = setTimeout(fetchGames, next);
  }

  function setCounts(live, final, upcoming) {
    document.getElementById('count-live').textContent = live;
    document.getElementById('count-final').textContent = final;
    document.getElementById('count-upcoming').textContent = upcoming;
  }

  function render(games) {
    // Sort: live > upcoming (by time) > final
    const bucketOrder = { live: 0, upcoming: 1, final: 2 };
    games.sort((a, b) => {
      const ba = bucketOrder[statusBucket(a)];
      const bb = bucketOrder[statusBucket(b)];
      if (ba !== bb) return ba - bb;
      return new Date(a.gameDate) - new Date(b.gameDate);
    });

    let liveCount = 0, finalCount = 0, upcomingCount = 0;
    games.forEach(g => {
      const b = statusBucket(g);
      if (b === 'live') liveCount++;
      else if (b === 'final') finalCount++;
      else upcomingCount++;
    });
    setCounts(liveCount, finalCount, upcomingCount);
    document.getElementById('subtitle').textContent = subtitleFor(games);

    const visible = games.slice(0, MAX_CARDS);
    const feed = document.getElementById('games');
    feed.innerHTML = '';
    const currentKeys = new Set();

    visible.forEach((g, idx) => {
      currentKeys.add(g.gamePk);
      const bucket = statusBucket(g);
      const off = isOffState(g);
      const started = bucket === 'live' || (bucket === 'final' && !off) || (off && g.linescore?.currentInning);
      const home = g.teams.home;
      const away = g.teams.away;
      const ls = g.linescore || {};

      const homeRuns = home.score ?? 0;
      const awayRuns = away.score ?? 0;
      const homeHits = ls.teams?.home?.hits ?? '-';
      const awayHits = ls.teams?.away?.hits ?? '-';

      // Winner/loser styling on finals
      let homeClass = '', awayClass = '';
      if (bucket === 'final' && !off) {
        if (homeRuns > awayRuns) { homeClass = 'winner'; awayClass = 'loser'; }
        else if (awayRuns > homeRuns) { awayClass = 'winner'; homeClass = 'loser'; }
      }

      // Status + inning text
      let statusText = 'SCHEDULED';
      let inningText = formatGameTime(g);
      const detailed = g.status?.detailedState || '';
      if (bucket === 'live') {
        statusText = /Delay/.test(detailed) ? 'DELAYED' : 'LIVE';
        const inning = ls.currentInning || 1;
        const ord = `${inning}${inningSuffix(inning)}`;
        if (ls.inningState === 'Middle') inningText = `MID ${ord}`;
        else if (ls.inningState === 'End') inningText = `END ${ord}`;
        else inningText = `${ls.inningHalf === 'Top' ? '▲' : '▼'} ${ord}`;
      } else if (off) {
        statusText = detailed.split(':')[0].toUpperCase();
        inningText = started ? `${ls.inningHalf === 'Top' ? '▲' : '▼'} ${ls.currentInning}` : '';
      } else if (bucket === 'final') {
        statusText = 'FINAL';
        const sched = ls.scheduledInnings || 9;
        inningText = ls.currentInning && ls.currentInning !== sched ? `F/${ls.currentInning}` : 'F';
      } else if (detailed === 'Warmup') {
        statusText = 'WARMUP';
      }

      // Footer: bases/outs/count when live, pitchers otherwise, series status in the postseason
      let footerHtml = '';
      const series = seriesStatus(g);
      const seriesLine = series ? `<div class="series">${series}</div>` : '';
      if (bucket === 'live') {
        // Between half-innings the feed still reports the last out and runners; show a clean slate
        const midBreak = ls.inningState === 'Middle' || ls.inningState === 'End';
        const outs = midBreak ? 0 : (ls.outs ?? 0);
        const bases = midBreak ? {} : (ls.offense || {});
        const showCount = !midBreak;
        footerHtml = `
          <div class="pitcher-info">${seriesLine}</div>
          <div class="diamond-wrap">
            ${showCount ? `<div class="count">${ls.balls ?? 0}-${ls.strikes ?? 0}</div>` : ''}
            <div class="diamond">
              <div class="base second ${bases.second ? 'on' : ''}"></div>
              <div class="base first ${bases.first ? 'on' : ''}"></div>
              <div class="base third ${bases.third ? 'on' : ''}"></div>
            </div>
            <div class="outs">
              <div class="out ${outs >= 1 ? 'on' : ''}"></div>
              <div class="out ${outs >= 2 ? 'on' : ''}"></div>
              <div class="out ${outs >= 3 ? 'on' : ''}"></div>
            </div>
          </div>`;
      } else if (bucket === 'upcoming') {
        const awayP = away.probablePitcher?.fullName;
        const homeP = home.probablePitcher?.fullName;
        const pitchers = (awayP || homeP) ? `<div>${lastName(awayP)} vs ${lastName(homeP)}</div>` : '';
        if (pitchers || seriesLine) footerHtml = `<div class="pitcher-info">${seriesLine}${pitchers}</div>`;
      } else if (!off) {
        const w = g.decisions?.winner?.fullName;
        const l = g.decisions?.loser?.fullName;
        const sv = g.decisions?.save?.fullName;
        const dec = w
          ? `<div><span class="label">W</span>${lastName(w)}  <span class="label">L</span>${lastName(l)}${sv ? `  <span class="label">S</span>${lastName(sv)}` : ''}</div>`
          : '';
        if (dec || seriesLine) footerHtml = `<div class="pitcher-info">${seriesLine}${dec}</div>`;
      }

      const recordText = side => side.leagueRecord ? `${side.leagueRecord.wins}-${side.leagueRecord.losses}` : '';
      const metaText = side => {
        const rec = recordText(side);
        return POSTSEASON[g.gameType] ? rec && `${rec} IN SERIES` : rec;
      };

      const card = document.createElement('div');
      card.className = `game ${bucket}`;
      card.dataset.gamepk = g.gamePk;
      if (!previousGameKeys.has(g.gamePk)) {
        card.classList.add('game-enter');
        card.style.animationDelay = `${idx * 40}ms`;
      }

      const teamRow = (side, cls, which, runs, hits) => `
          <div class="team-row ${cls}">
            <div class="logo"><img src="${logoUrl(side.team.id)}" alt="${side.team.name}" onerror="this.style.display='none'"/></div>
            <div>
              <div class="team-name">${side.team.teamName || side.team.name}</div>
              <div class="team-meta">${[metaText(side), which].filter(Boolean).join(' · ')}</div>
            </div>
            <div class="score" data-team="${which.toLowerCase()}">${started ? runs : ''}</div>
            <div class="hits">${started ? `${hits}<small>H</small>` : ''}</div>
          </div>`;

      card.innerHTML = `
        <div class="game-header">
          <div class="status"><span class="dot"></span>${statusText}</div>
          ${seriesTag(g)}
          <div class="inning-info">${inningText}</div>
        </div>
        <div class="teams">
          ${teamRow(away, awayClass, 'AWAY', awayRuns, awayHits)}
          ${teamRow(home, homeClass, 'HOME', homeRuns, homeHits)}
        </div>
        <div class="game-footer">
          ${footerHtml || '<div></div>'}
        </div>
      `;

      feed.appendChild(card);

      // Flash scores that changed since last poll
      const prev = previousScores.get(g.gamePk);
      if (prev) {
        if (prev.away !== awayRuns) card.querySelector('[data-team="away"]').classList.add('flash');
        if (prev.home !== homeRuns) card.querySelector('[data-team="home"]').classList.add('flash');
      }
      previousScores.set(g.gamePk, { home: homeRuns, away: awayRuns });
    });

    previousGameKeys = currentKeys;
    document.getElementById('ticker-label').textContent = 'SCORES';
    updateTicker(games);
  }

  function updateTicker(games) {
    const items = games.map(g => {
      const bucket = statusBucket(g);
      const away = g.teams.away;
      const home = g.teams.home;
      let statusLabel;
      if (isOffState(g)) {
        statusLabel = (g.status.detailedState || '').split(':')[0].toUpperCase();
      } else if (bucket === 'live') {
        const half = g.linescore?.inningHalf === 'Top' ? '▲' : '▼';
        statusLabel = `${half}${g.linescore?.currentInning || 1}`;
      } else if (bucket === 'final') {
        statusLabel = 'F';
      } else {
        statusLabel = formatGameTime(g);
      }
      const showScore = bucket !== 'upcoming';
      return `<div class="ticker-item">
        <span class="team-abbr">${abbr(away)}</span> <span class="score-val">${showScore ? away.score ?? '0' : ''}</span>
        <span class="separator">@</span>
        <span class="team-abbr">${abbr(home)}</span> <span class="score-val">${showScore ? home.score ?? '0' : ''}</span>
        <span class="separator">·</span> ${statusLabel}
      </div>`;
    }).join('');
    setTicker(items, games.length);
  }

  // Duplicate the track for a seamless loop; keep the scroll speed constant regardless of length
  function setTicker(itemsHtml, count) {
    const track = document.getElementById('ticker');
    track.innerHTML = itemsHtml + itemsHtml;
    track.style.animationDuration = `${Math.max(30, count * 7)}s`;
  }

  // --- Empty / offseason ---------------------------------------
  // Next game day(s) and the most recent World Series result. Cached per board date.
  async function loadOffseason(date) {
    if (offseasonCache.date === date) return offseasonCache.data;

    const nextUrl = `${API}?sportId=1&startDate=${addDays(date, 1)}&endDate=${addDays(date, LOOKAHEAD_DAYS)}` +
      `&gameType=${GAME_TYPES}&fields=dates,date,totalGames,games,gameType`;
    const wsUrl = `${API}?sportId=1&startDate=${addDays(date, -150)}&endDate=${date}&gameType=W&hydrate=team` +
      `&fields=dates,date,games,status,abstractGameState,teams,away,home,team,id,name,abbreviation,teamName,leagueRecord,wins,losses`;

    const [nextRes, wsRes] = await Promise.all([fetch(nextUrl), fetch(wsUrl)]);
    const nextData = nextRes.ok ? await nextRes.json() : { dates: [] };
    const wsData = wsRes.ok ? await wsRes.json() : { dates: [] };

    const dates = nextData.dates || [];
    const nextDay = dates[0] || null;
    const springStart = dates.find(d => d.games.some(g => g.gameType === 'S')) || null;
    const openingDay = dates.find(d => d.games.some(g => g.gameType === 'R')) || null;

    // Champion = winner of the last completed World Series game, if that team reached 4 wins
    let champ = null;
    const wsDates = wsData.dates || [];
    const lastWs = wsDates.length ? wsDates[wsDates.length - 1].games.slice(-1)[0] : null;
    if (lastWs && lastWs.status.abstractGameState === 'Final') {
      const a = lastWs.teams.away, h = lastWs.teams.home;
      const [w, l] = a.leagueRecord.wins > h.leagueRecord.wins ? [a, h] : [h, a];
      if (w.leagueRecord.wins >= 4) {
        champ = {
          team: w.team,
          loser: l.team,
          record: `${w.leagueRecord.wins}-${l.leagueRecord.wins}`,
          year: wsDates[wsDates.length - 1].date.slice(0, 4)
        };
      }
    }

    const data = { nextDay, springStart, openingDay, champ };
    offseasonCache = { date, data };
    return data;
  }

  const gamesWord = n => `${n} ${n === 1 ? 'GAME' : 'GAMES'}`;

  function nextLabel(day) {
    const types = new Set(day.games.map(g => g.gameType));
    if (types.has('R')) return 'REGULAR SEASON';
    if (types.has('S')) return 'SPRING TRAINING';
    if (types.has('A')) return 'ALL-STAR GAME';
    const post = [...types].map(t => POSTSEASON[t]).find(Boolean);
    return post ? post.long.toUpperCase() : 'GAMES';
  }

  async function renderEmpty(date) {
    setCounts(0, 0, 0);
    previousGameKeys = new Set();
    const feed = document.getElementById('games');
    const { nextDay, springStart, openingDay, champ } = await loadOffseason(date);

    const gap = nextDay ? daysBetween(date, nextDay.date) : null;
    const offseason = gap === null || gap > 7;
    const dayWord = dateOverride ? 'This Day' : 'Today';

    document.getElementById('subtitle').textContent = offseason ? 'MLB · OFFSEASON' : 'MLB · LIVE ACTIVE GAMES';

    const champHtml = (offseason && champ) ? `
      <div class="champ">
        <div class="logo"><img src="${logoUrl(champ.team.id)}" alt="${champ.team.name}" onerror="this.style.display='none'"/></div>
        <div>
          <div class="label">${champ.year} World Series Champions</div>
          <div class="name">${champ.team.name}</div>
          <div class="result">Def. ${champ.loser.name} ${champ.record}</div>
        </div>
      </div>` : '';

    const countdown = (day, what) => {
      const n = daysBetween(date, day.date);
      return `
        <div class="countdown">
          <div class="days">${n}<small>${n === 1 ? 'DAY' : 'DAYS'}</small></div>
          <div class="what">${what}</div>
          <div class="when">${prettyDate(day.date)} · ${gamesWord(day.totalGames)}</div>
        </div>`;
    };

    let countdowns = '';
    if (offseason) {
      if (springStart) countdowns += countdown(springStart, 'Spring Training');
      if (openingDay) countdowns += countdown(openingDay, 'Opening Day');
      if (!countdowns && nextDay) countdowns += countdown(nextDay, nextLabel(nextDay));
    } else if (nextDay) {
      countdowns = countdown(nextDay, `Next: ${nextLabel(nextDay)}`);
    }

    feed.innerHTML = `
      <div class="empty">
        <div>
          <div class="eyebrow">${offseason ? `No Games ${dayWord}` : prettyDate(date, { weekday: 'long', month: 'long', day: 'numeric' })}</div>
          <h2>${offseason ? 'The <em>Offseason</em>' : `No Games <em>${dayWord}</em>`}</h2>
          ${!nextDay ? '<div class="sub">Schedule not yet posted.</div>' : ''}
        </div>
        ${champHtml}
        ${countdowns ? `<div class="countdowns">${countdowns}</div>` : ''}
      </div>`;

    // Ticker
    const bits = [];
    if (offseason && champ) bits.push(`<span class="team-abbr">${champ.year} WORLD SERIES</span><span class="separator">·</span>${champ.team.abbreviation} def. ${champ.loser.abbreviation} <span class="score-val">${champ.record}</span>`);
    if (offseason && springStart) bits.push(`<span class="team-abbr">SPRING TRAINING</span><span class="separator">·</span>${prettyDate(springStart.date)}`);
    if (offseason && openingDay) bits.push(`<span class="team-abbr">OPENING DAY</span><span class="separator">·</span>${prettyDate(openingDay.date)}`);
    if (!offseason && nextDay) bits.push(`<span class="team-abbr">NEXT GAMES</span><span class="separator">·</span>${prettyDate(nextDay.date)} · ${gamesWord(nextDay.totalGames)}`);
    if (!bits.length) bits.push('NO GAMES SCHEDULED');
    document.getElementById('ticker-label').textContent = offseason ? 'OFFSEASON' : 'SCHEDULE';
    setTicker(bits.map(b => `<div class="ticker-item">${b}</div>`).join(''), bits.length * 3);
  }

  // --- Boot + poll --------------------------------------------
  fetchGames();
</script>
</body>
</html>
