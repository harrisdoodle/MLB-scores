<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Katz Konnection · Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --panel: #10151c;
    --panel-2: #151c26;
    --line: rgba(255,255,255,0.06);
    --line-strong: rgba(255,255,255,0.18);
    --text: #ffffff;
    --dim: #8a94a6;
    --live: #ff3b3b;
    --final: #6b7280;
    --upcoming: #f4b942;
    --diamond-on: #ffd84a;
    --diamond-off: rgba(255,255,255,0.12);
    --accent-text: #ffd84a;
    --card-bg: rgba(16,21,28,0.92);
    --overlay-shadow: 0 18px 40px rgba(0,0,0,0.55);
    /* 3D scene colors (hex only, read by three.js) */
    --map-land: #1b2431;
    --map-land-2: #121822;
    --map-edge: #34435a;
    --map-coast: #4a5d7a;
    --stad-base: #2b3442;
    --stad-seat: #6d7f99;
    --stad-field: #2f7d45;
    --stad-roof: #9fb0c8;
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-2: #f3f5f8;
    --line: rgba(15,23,42,0.08);
    --line-strong: rgba(15,23,42,0.2);
    --text: #0b1220;
    --dim: #5b6475;
    --live: #e11d2e;
    --final: #9aa1ad;
    --upcoming: #c98a00;
    --diamond-on: #f5b800;
    --diamond-off: rgba(15,23,42,0.1);
    --accent-text: #a26f00;
    --card-bg: rgba(255,255,255,0.94);
    --overlay-shadow: 0 18px 40px rgba(15,23,42,0.18);
    --map-land: #d6dce5;
    --map-land-2: #e3e7ed;
    --map-edge: #aeb8c6;
    --map-coast: #8d99ab;
    --stad-base: #8f99a8;
    --stad-seat: #c3ccd9;
    --stad-field: #3f9a57;
    --stad-roof: #e8edf4;
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Archivo', sans-serif;
    overflow: hidden;
  }

  #stage-wrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--bg);
  }

  #stage {
    width: 1920px;
    height: 1080px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    overflow: hidden;
  }

  #scene, #lines, #labels, #cards { position: absolute; inset: 0; }
  #scene canvas { display: block; }
  #lines { pointer-events: none; }
  #labels { pointer-events: none; }
  #cards { pointer-events: none; }

  /* Header */
  header {
    position: absolute;
    left: 48px;
    right: 48px;
    top: 32px;
    height: 100px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 32px;
    z-index: 5;
  }

  .brand { display: flex; align-items: center; gap: 18px; }

  .brand-mark {
    width: 72px;
    height: 72px;
    border-radius: 14px;
    color: #fff;
    background: linear-gradient(135deg, #ff3b3b 0%, #b80d0d 100%);
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 38px;
    letter-spacing: -2px;
    box-shadow: 0 10px 40px rgba(255,59,59,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .brand-text .title {
    font-weight: 900;
    font-size: 44px;
    letter-spacing: -1.5px;
    line-height: 0.9;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .brand-text .title em { font-style: normal; color: var(--live); }

  .brand-text .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .header-center { display: flex; justify-content: center; gap: 24px; }

  .stat-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 24px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    min-width: 110px;
  }

  .stat-chip .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .stat-chip .value {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 32px;
    line-height: 1;
    margin-top: 4px;
  }

  .stat-chip.live .value { color: var(--live); }
  .stat-chip.final .value { color: var(--dim); }
  .stat-chip.upcoming .value { color: var(--upcoming); }

  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

  .clock {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1;
    letter-spacing: -0.5px;
  }

  .date-nav { display: flex; align-items: center; gap: 8px; }

  .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    padding: 0 6px;
  }

  .date .archive { color: var(--accent-text); }

  .nav-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    height: 42px;
    min-width: 42px;
    padding: 0 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .nav-btn:hover { border-color: var(--line-strong); background: var(--panel-2); }
  .nav-btn.arrow { font-size: 20px; padding: 0; }
  .nav-btn[hidden] { display: none; }
  .nav-btn svg { width: 18px; height: 18px; }

  /* Weather badge floating over each stadium */
  .wx {
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px 4px 6px;
    border-radius: 999px;
    background: var(--card-bg);
    border: 1px solid var(--line-strong);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    box-shadow: var(--overlay-shadow);
    will-change: transform;
  }

  .wx svg { width: 18px; height: 18px; color: var(--accent-text); }
  .wx .dome { font-size: 10px; letter-spacing: 1px; color: var(--dim); }

  /* Score cards around the map */
  .mcard {
    position: absolute;
    width: 236px;
    padding: 10px 12px 10px 14px;
    background: var(--card-bg);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    box-shadow: var(--overlay-shadow);
    pointer-events: auto;
    cursor: pointer;
    overflow: hidden;
    transition: left 0.6s ease, top 0.6s ease, border-color 0.2s ease;
  }

  .mcard::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--final);
  }

  .mcard.live::before { background: var(--live); box-shadow: 0 0 16px var(--live); }
  .mcard.upcoming::before { background: var(--upcoming); }
  .mcard.live { border-color: rgba(255,59,59,0.4); }
  .mcard:hover { border-color: var(--text); }

  .mc-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 6px;
  }

  .mcard.live .mc-head .st { color: var(--live); }
  .mcard.upcoming .mc-head .st { color: var(--upcoming); }
  .mc-head .where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .mc-row {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 8px;
    height: 30px;
  }

  .mc-row img { width: 26px; height: 26px; object-fit: contain; }

  .mc-row .tm {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .mc-row .sc {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 24px;
  }

  .mc-row.loser .tm, .mc-row.loser .sc { color: var(--dim); }

  .mc-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.5px;
    min-height: 14px;
  }

  .mini-bases { display: flex; align-items: center; gap: 8px; }
  .mini-diamond { width: 26px; height: 16px; position: relative; }
  .mini-diamond i {
    position: absolute;
    width: 7px;
    height: 7px;
    transform: rotate(45deg);
    background: var(--diamond-off);
    border: 1px solid var(--line-strong);
  }
  .mini-diamond i.on { background: var(--diamond-on); }
  .mini-diamond .b1 { right: 1px; top: 7px; }
  .mini-diamond .b2 { left: 9px; top: 1px; }
  .mini-diamond .b3 { left: 1px; top: 7px; }
  .mini-outs { display: flex; gap: 3px; }
  .mini-outs i { width: 6px; height: 6px; border-radius: 50%; background: var(--diamond-off); }
  .mini-outs i.on { background: var(--diamond-on); }

  #banner {
    position: absolute;
    left: 50%;
    bottom: 64px;
    transform: translateX(-50%);
    display: none;
    padding: 18px 36px;
    background: var(--card-bg);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    box-shadow: var(--overlay-shadow);
    text-align: center;
    z-index: 4;
  }

  #banner h2 {
    font-weight: 900;
    font-size: 40px;
    letter-spacing: -1px;
    text-transform: uppercase;
  }

  #banner h2 em { font-style: normal; color: var(--live); }

  #banner div {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--dim);
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* Google Earth fly-in */
  #earth { position: absolute; inset: 0; display: none; background: #000; }
  #earth canvas { display: block; }
  body.flying #earth { display: block; }
  /* Scrims keep the header and credits readable over the imagery */
  #earth::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(5,8,12,0.75) 0, rgba(5,8,12,0) 200px),
      linear-gradient(to top, rgba(5,8,12,0.55) 0, rgba(5,8,12,0) 90px);
  }
  body.flying header .title { color: #fff; }
  body.flying header .subtitle { color: rgba(255,255,255,0.75); }
  body.flying .clock { color: #fff; }
  body.flying #scene, body.flying #lines, body.flying #labels, body.flying #cards, body.flying #banner { display: none; }
  body.flying .header-center { visibility: hidden; }

  #fly {
    position: absolute;
    left: 48px;
    top: 168px;
    width: 420px;
    display: none;
    flex-direction: column;
    gap: 14px;
    z-index: 6;
  }

  body.flying #fly { display: flex; }

  .fly-venue {
    padding: 18px 20px;
    background: var(--card-bg);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    box-shadow: var(--overlay-shadow);
  }

  .fly-venue h2 {
    font-weight: 900;
    font-size: 34px;
    line-height: 1;
    letter-spacing: -1px;
    text-transform: uppercase;
  }

  .fly-venue .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
    color: var(--dim);
    text-transform: uppercase;
    margin-top: 8px;
  }

  .fly-venue .wx { position: static; display: inline-flex; margin-top: 12px; box-shadow: none; }

  #fly .mcard { position: relative; width: 100%; cursor: default; }
  #fly .mcard .mc-row { height: 40px; grid-template-columns: 34px 1fr auto; }
  #fly .mcard .mc-row img { width: 34px; height: 34px; }
  #fly .mcard .mc-row .tm { font-size: 28px; }
  #fly .mcard .mc-row .sc { font-size: 34px; }
  #fly .mcard .mc-head { font-size: 13px; }
  #fly .mcard .mc-foot { font-size: 12px; }

  .fly-actions { display: flex; gap: 10px; }
  .fly-actions .nav-btn { flex: 1; }

  #fly-status {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    display: none;
    z-index: 6;
  }

  #google-credit {
    position: absolute;
    left: 16px;
    bottom: 12px;
    display: none;
    align-items: flex-end;
    gap: 12px;
    max-width: 1400px;
    z-index: 6;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }

  body.flying #google-credit { display: flex; }
  #google-credit img { height: 18px; }

  #loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px;
    color: var(--dim);
    z-index: 3;
  }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
</script>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <div id="scene"></div>
    <svg id="lines" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
    <div id="labels"></div>
    <div id="cards"></div>
    <div id="banner"></div>
    <div id="earth"></div>
    <div id="fly"></div>
    <div id="fly-status">LOADING GOOGLE EARTH…</div>
    <div id="google-credit"><img src="https://maps.gstatic.com/mapfiles/api-3/images/google_white5.png" alt="Google"/><span id="google-attr"></span></div>
    <div id="loading">LOADING MAP…</div>

    <header>
      <div class="brand">
        <div class="brand-mark">K</div>
        <div class="brand-text">
          <div class="title">THE KATZ <em>KONNECTION</em></div>
          <div class="subtitle" id="subtitle">MLB · LIVE MAP</div>
        </div>
      </div>
      <div class="header-center">
        <div class="stat-chip live"><div class="label">Live</div><div class="value" id="count-live">0</div></div>
        <div class="stat-chip final"><div class="label">Final</div><div class="value" id="count-final">0</div></div>
        <div class="stat-chip upcoming"><div class="label">Upcoming</div><div class="value" id="count-upcoming">0</div></div>
      </div>
      <div class="header-right">
        <div class="clock" id="clock">-:--</div>
        <div class="date-nav">
          <button class="nav-btn arrow" id="day-prev" aria-label="Previous day">‹</button>
          <span class="date" id="date"></span>
          <button class="nav-btn arrow" id="day-next" aria-label="Next day">›</button>
          <button class="nav-btn" id="day-today" hidden>Today</button>
          <a class="nav-btn" id="board-link" href="index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Board
          </a>
          <button class="nav-btn" id="theme-btn" aria-label="Toggle light and dark"></button>
        </div>
      </div>
    </header>
  </div>
</div>

<script type="module">
  /* =========================================================
     THE KATZ KONNECTION: Live Map
     Tilted 3D map of the US + Canada with a ballpark at every
     venue, weather over each game, and score cards around the
     edge tied to their park. Same data and cadence as the board.

     URL params: ?date=YYYY-MM-DD   ?theme=light|dark
     ========================================================= */
  import * as THREE from 'three';
  import { geoConicConformal } from 'https://cdn.jsdelivr.net/npm/d3-geo@3.1.0/+esm';
  import { feature, mesh } from 'https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm';

  const API = 'https://statsapi.mlb.com/api/v1/schedule';
  const GAME_TYPES = 'S,R,A,F,D,L,W';
  const ROLLOVER_HOUR = 6;
  const POLL_LIVE = 15 * 1000;
  const POLL_IDLE = 60 * 1000;
  const POLL_EMPTY = 30 * 60 * 1000;
  const WEATHER_TTL = 10 * 60 * 1000;
  const FIRST_DATE = '1901-04-18';
  const W = 1920, H = 1080;
  const CARD_W = 236, CARD_H = 112;
  const NON_LOWER48 = new Set(['02', '15', '60', '66', '69', '72', '78']);

  // --- Stage scale --------------------------------------------
  function scaleStage() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    document.getElementById('stage').style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  window.addEventListener('resize', scaleStage);
  scaleStage();

  // --- Dates --------------------------------------------------
  const pad = n => String(n).padStart(2, '0');
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  function fromISO(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
  function addDays(iso, n) { const d = fromISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
  function todayBoardDate() {
    const now = new Date();
    if (now.getHours() < ROLLOVER_HOUR) now.setDate(now.getDate() - 1);
    return toISO(now);
  }
  function dateFromUrl() {
    const d = new URLSearchParams(location.search).get('date') || '';
    return /^\d{4}-\d{2}-\d{2}$/.test(d) && d >= FIRST_DATE ? d : null;
  }
  let dateOverride = dateFromUrl();
  const boardDate = () => dateOverride || todayBoardDate();
  const prettyDate = (iso, opts) => fromISO(iso).toLocaleDateString('en-US', opts || { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();

  function updateClock() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    const label = prettyDate(boardDate(), dateOverride ? { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' } : undefined);
    document.getElementById('date').innerHTML = dateOverride ? `<span class="archive">${label}</span>` : label;
    document.getElementById('day-today').hidden = !dateOverride;
    document.getElementById('board-link').href = 'index.html' + (dateOverride ? `?date=${dateOverride}` : '');
  }
  updateClock();
  setInterval(updateClock, 1000);

  // --- Theme --------------------------------------------------
  const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    document.getElementById('theme-btn').innerHTML = theme === 'light' ? MOON_ICON : SUN_ICON;
    if (sceneReady) recolorScene();
  }
  function initialTheme() {
    const t = new URLSearchParams(location.search).get('theme');
    if (t === 'light' || t === 'dark') return t;
    try { return localStorage.getItem('kk-theme') || 'dark'; } catch (e) { return 'dark'; }
  }
  let sceneReady = false;
  applyTheme(initialTheme());
  document.getElementById('theme-btn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('kk-theme', next); } catch (e) { /* private mode */ }
  });
  const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  // --- Game helpers (same rules as the board) -----------------
  const logoUrl = id => `https://www.mlbstatic.com/team-logos/${id}.svg`;
  const abbr = side => side.team.abbreviation || side.team.name.slice(0, 3).toUpperCase();
  const isOffState = g => /Postponed|Cancelled|Suspended/.test(g.status?.detailedState || '');
  function statusBucket(g) {
    const abs = g.status?.abstractGameState || '';
    const detailed = g.status?.detailedState || '';
    if (isOffState(g)) return 'final';
    if (detailed === 'Warmup' || detailed === 'Pre-Game') return 'upcoming';
    if (abs === 'Live') return 'live';
    if (abs === 'Final') return 'final';
    return 'upcoming';
  }
  function inningSuffix(n) {
    if (n >= 11 && n <= 13) return 'th';
    return ({ 1: 'st', 2: 'nd', 3: 'rd' })[n % 10] || 'th';
  }
  function formatGameTime(g) {
    if (g.status?.startTimeTBD) return 'TBD';
    return new Date(g.gameDate).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  }

  // --- Map geometry -------------------------------------------
  const [usTopo, worldTopo] = await Promise.all([
    fetch('https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json').then(r => r.json()),
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json').then(r => r.json())
  ]);
  const statesAll = feature(usTopo, usTopo.objects.states).features;
  const lower48 = statesAll.filter(f => !NON_LOWER48.has(f.id));
  const countries = feature(worldTopo, worldTopo.objects.countries).features;
  const neighbors = countries.filter(f => f.id === '124' || f.id === '484'); // Canada, Mexico

  // Conic conformal tuned to the lower 48; Toronto sits comfortably inside the frame
  const projection = geoConicConformal().parallels([29.5, 45.5]).rotate([96, 0])
    .fitExtent([[-480, -270], [480, 270]], { type: 'FeatureCollection', features: lower48 });
  const LAND_H = 3;   // extrusion height of US states

  // --- Three.js scene -----------------------------------------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  document.getElementById('scene').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(24, W / H, 10, 6000);
  const CAM_BASE = new THREE.Vector3(0, 980, 1080);
  const CAM_TARGET = new THREE.Vector3(0, 0, 40);
  camera.position.copy(CAM_BASE);
  camera.lookAt(CAM_TARGET);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 1.4);
  sun.position.set(-400, 900, 500);
  scene.add(sun);

  const mats = {
    land: new THREE.MeshStandardMaterial({ roughness: 0.95, metalness: 0 }),
    land2: new THREE.MeshStandardMaterial({ roughness: 1, metalness: 0 }),
    edge: new THREE.LineBasicMaterial({ transparent: true, opacity: 0.9 }),
    coast: new THREE.LineBasicMaterial({}),
    base: new THREE.MeshStandardMaterial({ roughness: 0.8 }),
    seat: new THREE.MeshStandardMaterial({ roughness: 0.6, side: THREE.DoubleSide }),
    field: new THREE.MeshStandardMaterial({ roughness: 0.9 }),
    infield: new THREE.MeshStandardMaterial({ color: 0xc9a36b, roughness: 1 }),
    roof: new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.2, transparent: true, opacity: 0.92 }),
    roofGlass: new THREE.MeshStandardMaterial({ roughness: 0.2, metalness: 0.3, transparent: true, opacity: 0.4, side: THREE.DoubleSide }),
    tower: new THREE.MeshStandardMaterial({ color: 0x8892a2 }),
    lamp: new THREE.MeshBasicMaterial({ color: 0xfff3c4 })
  };

  function recolorScene() {
    mats.land.color.set(cssVar('--map-land'));
    mats.land2.color.set(cssVar('--map-land-2'));
    mats.edge.color.set(cssVar('--map-edge'));
    mats.coast.color.set(cssVar('--map-coast'));
    mats.base.color.set(cssVar('--stad-base'));
    mats.seat.color.set(cssVar('--stad-seat'));
    mats.field.color.set(cssVar('--stad-field'));
    mats.roof.color.set(cssVar('--stad-roof'));
    mats.roofGlass.color.set(cssVar('--stad-roof'));
    liveRingMat.color.set(cssVar('--live'));
  }

  // Projected ring -> THREE.Shape points (y flipped so +z points toward the camera after rotation)
  function ringPoints(ring) {
    const pts = [];
    for (const c of ring) {
      const p = projection(c);
      if (p) pts.push(new THREE.Vector2(p[0], -p[1]));
    }
    return pts.length > 2 ? pts : null;
  }

  function polyArea(pts) {
    let a = 0;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) a += (pts[j].x + pts[i].x) * (pts[j].y - pts[i].y);
    return Math.abs(a / 2);
  }

  function extrudeFeature(f, depth, material, minArea) {
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const poly of polys) {
      const outer = ringPoints(poly[0]);
      if (!outer || polyArea(outer) < minArea) continue;
      const shape = new THREE.Shape(outer);
      for (const hole of poly.slice(1)) {
        const h = ringPoints(hole);
        if (h) shape.holes.push(new THREE.Path(h));
      }
      const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 1 });
      geo.rotateX(-Math.PI / 2);
      scene.add(new THREE.Mesh(geo, material));
    }
  }

  // Neighbours sit slightly lower so the US reads as the stage
  neighbors.forEach(f => extrudeFeature(f, 1.5, mats.land2, 4));
  lower48.forEach(f => extrudeFeature(f, LAND_H, mats.land, 0.5));

  // State borders + US coastline as lines on top of the land
  function addLines(multiLine, material, y) {
    const positions = [];
    for (const line of multiLine.coordinates) {
      for (let i = 1; i < line.length; i++) {
        const a = line[i - 1], b = line[i];
        if (a[0] < -128 || a[1] < 23 || b[0] < -128 || b[1] < 23) continue; // skip Alaska / Hawaii / territories
        const pa = projection(a), pb = projection(b);
        if (!pa || !pb) continue;
        positions.push(pa[0], y, pa[1], pb[0], y, pb[1]);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    scene.add(new THREE.LineSegments(geo, material));
  }
  addLines(mesh(usTopo, usTopo.objects.states, (a, b) => a !== b), mats.edge, LAND_H + 0.05);
  addLines(mesh(usTopo, usTopo.objects.states, (a, b) => a === b), mats.coast, LAND_H + 0.05);

  // --- Ballpark model -------------------------------------------
  const liveRingMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false });
  const STADIUM_SCALE = 2.5;

  // Shared geometries
  const G = {
    base: new THREE.CylinderGeometry(6.6, 7, 1.2, 40),
    field: new THREE.CircleGeometry(5.8, 40),
    infield: new THREE.PlaneGeometry(2.4, 2.4),
    // Seating bowl: open toward -z (outfield faces north/away from camera)
    bowl: new THREE.LatheGeometry(
      [new THREE.Vector2(5.9, 0), new THREE.Vector2(6.6, 0), new THREE.Vector2(7.6, 3.4), new THREE.Vector2(7.2, 3.6)],
      48, Math.PI * 1.27, Math.PI * 1.46),
    tower: new THREE.CylinderGeometry(0.14, 0.18, 6.5, 6),
    lamp: new THREE.BoxGeometry(1, 0.5, 0.3),
    dome: new THREE.SphereGeometry(7.7, 40, 12, 0, Math.PI * 2, 0, Math.PI / 2),
    ring: new THREE.RingGeometry(8.4, 9.6, 48)
  };

  function makeStadium(roof) {
    const g = new THREE.Group();
    const base = new THREE.Mesh(G.base, mats.base);
    base.position.y = 0.6;
    g.add(base);

    const field = new THREE.Mesh(G.field, mats.field);
    field.rotation.x = -Math.PI / 2;
    field.position.y = 1.22;
    g.add(field);

    const infield = new THREE.Mesh(G.infield, mats.infield);
    infield.rotation.x = -Math.PI / 2;
    infield.rotation.z = Math.PI / 4;
    infield.position.set(0, 1.25, 2.6);
    g.add(infield);

    const bowl = new THREE.Mesh(G.bowl, mats.seat);
    bowl.position.y = 1.2;
    g.add(bowl);

    [-0.55, 0.55, Math.PI - 0.9, Math.PI + 0.9].forEach(a => {
      const x = Math.sin(a) * 7.9, z = Math.cos(a) * 7.9;
      const t = new THREE.Mesh(G.tower, mats.tower);
      t.position.set(x, 4.4, z);
      g.add(t);
      const l = new THREE.Mesh(G.lamp, mats.lamp);
      l.position.set(x, 7.8, z);
      l.lookAt(0, 6, 0);
      g.add(l);
    });

    if (roof === 'Dome' || roof === 'Retractable') {
      const dome = new THREE.Mesh(G.dome, roof === 'Dome' ? mats.roof : mats.roofGlass);
      dome.scale.y = 0.38;
      dome.position.y = 4.6;
      g.add(dome);
    }

    const ring = new THREE.Mesh(G.ring, liveRingMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.3;
    ring.visible = false;
    g.add(ring);
    g.userData.ring = ring;

    g.scale.setScalar(STADIUM_SCALE);
    return g;
  }

  recolorScene();
  sceneReady = true;
  document.getElementById('loading').remove();

  // --- Venues + layout -----------------------------------------
  const venues = new Map();   // venueId -> {id, name, city, lon, lat, roof, x, z, home:[x,z], model, games:[]}
  let homeParks = [];         // current season's 30 parks, shown dim on quiet days

  async function loadHomeParks() {
    try {
      const year = new Date().getFullYear();
      const data = await (await fetch(`https://statsapi.mlb.com/api/v1/teams?sportId=1&season=${year}&hydrate=venue(location,fieldInfo)`)).json();
      homeParks = data.teams.map(t => t.venue).filter(v => v.location?.defaultCoordinates);
    } catch (err) {
      console.error('Teams error:', err);
    }
  }

  function ensureVenue(v) {
    const c = v.location?.defaultCoordinates;
    if (!c || c.latitude == null) return null;
    let entry = venues.get(v.id);
    if (!entry) {
      const p = projection([c.longitude, c.latitude]);
      const onMap = p && Math.abs(p[0]) < 620 && Math.abs(p[1]) < 400;
      entry = {
        id: v.id, name: v.name, city: v.location?.city || '', lat: c.latitude, lon: c.longitude,
        roof: v.fieldInfo?.roofType || 'Open', onMap, home: p ? [p[0], p[1]] : [0, 0],
        elevFt: v.location?.elevation ?? 0, azimuth: v.location?.azimuthAngle ?? 0,
        x: p ? p[0] : 0, z: p ? p[1] : 0, model: null, games: []
      };
      venues.set(v.id, entry);
    }
    return entry;
  }

  // Push overlapping parks apart (NYY/NYM, CHC/CWS, LAD/LAA, spring clusters) so each model is readable
  function relaxVenues(list) {
    const MIN = 15 * STADIUM_SCALE;
    list.forEach(v => { v.x = v.home[0]; v.z = v.home[1]; });
    for (let iter = 0; iter < 120; iter++) {
      let moved = false;
      for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
          const a = list[i], b = list[j];
          let dx = b.x - a.x, dz = b.z - a.z;
          let d = Math.hypot(dx, dz);
          if (d >= MIN) continue;
          if (d < 0.01) { dx = 1; dz = 0.3 * (j - i); d = Math.hypot(dx, dz); }
          const push = (MIN - d) / 2 + 0.01;
          a.x -= dx / d * push; a.z -= dz / d * push;
          b.x += dx / d * push; b.z += dz / d * push;
          moved = true;
        }
      }
      if (!moved) break;
    }
  }

  // Tether from a park's true location to its nudged spot
  const tetherMat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.6 });
  let tethers = null;

  function syncModels(activeIds) {
    const shown = [...venues.values()].filter(v => v.onMap && (activeIds.has(v.id) || v.dim));
    relaxVenues(shown);

    venues.forEach(v => {
      const show = shown.includes(v);
      if (show && !v.model) {
        v.model = makeStadium(v.roof);
        scene.add(v.model);
      }
      if (v.model) {
        v.model.visible = show;
        v.model.position.set(v.x, LAND_H, v.z);
        const active = activeIds.has(v.id);
        // Parks without a game today shrink and fade into the map
        v.model.scale.setScalar(STADIUM_SCALE * (active ? 1 : 0.6));
        v.model.userData.ring.visible = active && v.games.some(g => statusBucket(g) === 'live');
      }
    });

    if (tethers) { scene.remove(tethers); tethers.geometry.dispose(); }
    const pos = [];
    shown.forEach(v => {
      if (Math.hypot(v.x - v.home[0], v.z - v.home[1]) > 2) pos.push(v.home[0], LAND_H + 0.2, v.home[1], v.x, LAND_H + 0.2, v.z);
    });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    tetherMat.color.set(cssVar('--dim'));
    tethers = new THREE.LineSegments(geo, tetherMat);
    scene.add(tethers);
  }

  // --- Weather ----------------------------------------------------
  const WX = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: MOON_ICON,
    partly: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v1.5M3.5 7.5H5M4.8 4.3l1 1M12 5.6A4 4 0 0 0 6 9"/><path d="M17.5 20H8a4.5 4.5 0 1 1 1.3-8.8A5.5 5.5 0 0 1 19.8 13 3.5 3.5 0 0 1 17.5 20z"/></svg>',
    cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H8a5 5 0 1 1 1.5-9.8A6 6 0 0 1 20.7 12 3.5 3.5 0 0 1 17.5 19z"/></svg>',
    rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 15H8a4.5 4.5 0 1 1 1.3-8.8A5.5 5.5 0 0 1 19.8 8.5 3.3 3.3 0 0 1 17.5 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg>',
    snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 15H8a4.5 4.5 0 1 1 1.3-8.8A5.5 5.5 0 0 1 19.8 8.5 3.3 3.3 0 0 1 17.5 15z"/><path d="M8 19h.01M12 21h.01M16 19h.01M10 22h.01M14 22h.01"/></svg>',
    storm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 15H8a4.5 4.5 0 1 1 1.3-8.8A5.5 5.5 0 0 1 19.8 8.5 3.3 3.3 0 0 1 17.5 15z"/><path d="M13 14l-3 4h4l-3 4"/></svg>',
    fog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></svg>'
  };

  // Rough local hour at the park from UTC + longitude, for sun vs moon
  function isNightAt(v, isoTime) {
    const d = isoTime ? new Date(isoTime) : new Date();
    const local = (d.getUTCHours() + d.getUTCMinutes() / 60 + v.lon / 15 + 24) % 24;
    return local < 6.5 || local >= 19.5;
  }

  function iconFromCondition(text, night) {
    const t = (text || '').toLowerCase();
    if (/thunder|storm/.test(t)) return 'storm';
    if (/snow|sleet|flurr/.test(t)) return 'snow';
    if (/rain|drizzle|shower/.test(t)) return 'rain';
    if (/fog|haze|mist|smoke/.test(t)) return 'fog';
    if (/partly|mostly sunny|mostly clear/.test(t)) return night ? 'moon' : 'partly';
    if (/cloud|overcast/.test(t)) return 'cloud';
    return night ? 'moon' : 'sun';
  }

  function iconFromWmo(code, isDay) {
    if (code >= 95) return 'storm';
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
    if (code === 45 || code === 48) return 'fog';
    if (code === 1 || code === 2) return isDay ? 'partly' : 'moon';
    if (code === 3) return 'cloud';
    return isDay ? 'sun' : 'moon';
  }

  const liveWeather = new Map();   // venueId -> {temp, icon, at}

  // Open-Meteo current conditions for today's parks without an official game-time report
  async function refreshLiveWeather(list) {
    const stale = list.filter(v => !liveWeather.has(v.id) || Date.now() - liveWeather.get(v.id).at > WEATHER_TTL);
    if (!stale.length) return;
    const lat = stale.map(v => v.lat.toFixed(3)).join(',');
    const lon = stale.map(v => v.lon.toFixed(3)).join(',');
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day&temperature_unit=fahrenheit`);
      let data = await res.json();
      if (!Array.isArray(data)) data = [data];
      data.forEach((d, i) => {
        if (!d.current) return;
        liveWeather.set(stale[i].id, {
          temp: Math.round(d.current.temperature_2m),
          icon: iconFromWmo(d.current.weather_code, d.current.is_day),
          at: Date.now()
        });
      });
    } catch (err) {
      console.error('Weather error:', err);
    }
  }

  // Official game-time weather from the schedule wins; live Open-Meteo fills in for today
  function weatherFor(v) {
    const g = v.games.find(x => x.weather && x.weather.temp) || null;
    const roofNote = v.roof === 'Dome' ? '<span class="dome">DOME</span>' : (v.roof === 'Retractable' ? '<span class="dome">ROOF</span>' : '');
    if (g) {
      if (/dome|roof closed/i.test(g.weather.condition || '')) return `${WX.cloud}${g.weather.temp}°<span class="dome">ROOF CLOSED</span>`;
      return `${WX[iconFromCondition(g.weather.condition, isNightAt(v, g.gameDate))]}${g.weather.temp}°${roofNote}`;
    }
    const live = liveWeather.get(v.id);
    if (live) return `${WX[live.icon]}${live.temp}°${roofNote}`;
    return '';
  }

  // --- Cards + slot assignment -------------------------------------
  // Slots ring the map: left and right columns, plus rows along the top and bottom
  // The top row covers the northern parks, so it carries a penalty and only fills on heavy days
  const SLOTS = [];
  for (let i = 0; i < 6; i++) {
    const y = 150 + i * 152;
    SLOTS.push({ x: 28, y, penalty: 0 }, { x: W - 28 - CARD_W, y, penalty: 0 });
  }
  for (let i = 0; i < 5; i++) {
    const x = 300 + i * 268;
    SLOTS.push({ x, y: H - 28 - CARD_H, penalty: 0 }, { x, y: 150, penalty: 900 });
  }

  let assignment = new Map();   // gamePk -> slot index
  let assignmentKey = '';

  function segIntersect(a, b, c, d) {
    const o = (p, q, r) => Math.sign((q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x));
    return o(a, b, c) !== o(a, b, d) && o(c, d, a) !== o(c, d, b);
  }

  const slotCenter = s => ({ x: s.x + CARD_W / 2, y: s.y + CARD_H / 2 });

  // Greedy nearest slot, then swap pairs while it shortens lines or removes crossings
  function assignSlots(items) {
    const pairs = [];
    items.forEach((it, i) => SLOTS.forEach((s, j) => {
      const c = slotCenter(s);
      pairs.push({ i, j, d: Math.hypot(c.x - it.sx, c.y - it.sy) + s.penalty });
    }));
    pairs.sort((a, b) => a.d - b.d);
    const gameSlot = new Array(items.length).fill(-1);
    const used = new Set();
    for (const p of pairs) {
      if (gameSlot[p.i] !== -1 || used.has(p.j)) continue;
      gameSlot[p.i] = p.j;
      used.add(p.j);
    }
    const cost = (i, j) => {
      const c = slotCenter(SLOTS[j]);
      return Math.hypot(c.x - items[i].sx, c.y - items[i].sy) + SLOTS[j].penalty;
    };
    const seg = (i, j) => [{ x: items[i].sx, y: items[i].sy }, slotCenter(SLOTS[j])];
    for (let pass = 0; pass < 30; pass++) {
      let improved = false;
      for (let a = 0; a < items.length; a++) {
        for (let b = a + 1; b < items.length; b++) {
          const ja = gameSlot[a], jb = gameSlot[b];
          if (ja < 0 || jb < 0) continue;
          const [p1, p2] = seg(a, ja), [q1, q2] = seg(b, jb);
          const crossing = segIntersect(p1, p2, q1, q2);
          const before = cost(a, ja) + cost(b, jb);
          const after = cost(a, jb) + cost(b, ja);
          if (after < before - 1 || (crossing && after < before * 1.25)) {
            gameSlot[a] = jb; gameSlot[b] = ja;
            improved = true;
          }
        }
      }
      if (!improved) break;
    }
    return gameSlot;
  }

  function cardHtml(g) {
    const bucket = statusBucket(g);
    const ls = g.linescore || {};
    const off = isOffState(g);
    const started = bucket === 'live' || (bucket === 'final' && !off);
    let st = 'SCHEDULED', right = formatGameTime(g);
    if (bucket === 'live') {
      st = /Delay/.test(g.status.detailedState || '') ? 'DELAYED' : '● LIVE';
      const inn = ls.currentInning || 1;
      if (ls.inningState === 'Middle') right = `MID ${inn}${inningSuffix(inn)}`;
      else if (ls.inningState === 'End') right = `END ${inn}${inningSuffix(inn)}`;
      else right = `${ls.inningHalf === 'Top' ? '▲' : '▼'} ${inn}${inningSuffix(inn)}`;
    } else if (off) {
      st = (g.status.detailedState || '').split(':')[0];
      right = '';
    } else if (bucket === 'final') {
      st = 'FINAL';
      right = ls.currentInning && ls.currentInning !== (ls.scheduledInnings || 9) ? `F/${ls.currentInning}` : '';
    }
    const a = g.teams.away, h = g.teams.home;
    const ar = a.score ?? 0, hr = h.score ?? 0;
    const cls = side => bucket === 'final' && !off && ((side === 'away' && ar < hr) || (side === 'home' && hr < ar)) ? 'loser' : '';
    const row = (side, t, r) => `
      <div class="mc-row ${cls(side)}">
        <img src="${logoUrl(t.team.id)}" alt="" onerror="this.style.visibility='hidden'"/>
        <span class="tm">${abbr(t)}</span>
        <span class="sc">${started ? r : ''}</span>
      </div>`;

    let foot = `<span>${g.venue?.name || ''}</span>`;
    if (bucket === 'live') {
      const mid = ls.inningState === 'Middle' || ls.inningState === 'End';
      const o = mid ? {} : (ls.offense || {});
      const outs = mid ? 0 : (ls.outs ?? 0);
      foot = `<span>${g.venue?.name || ''}</span>
        <span class="mini-bases">
          <span class="mini-diamond"><i class="b3 ${o.third ? 'on' : ''}"></i><i class="b2 ${o.second ? 'on' : ''}"></i><i class="b1 ${o.first ? 'on' : ''}"></i></span>
          <span class="mini-outs"><i class="${outs >= 1 ? 'on' : ''}"></i><i class="${outs >= 2 ? 'on' : ''}"></i></span>
        </span>`;
    }
    return `<div class="mc-head"><span class="st">${st}</span><span class="where">${right}</span></div>
      ${row('away', a, ar)}${row('home', h, hr)}
      <div class="mc-foot">${foot}</div>`;
  }

  // --- Projection helpers for overlays ------------------------------
  const tmpV = new THREE.Vector3();
  function toScreen(x, y, z) {
    tmpV.set(x, y, z).project(camera);
    return { x: (tmpV.x + 1) / 2 * W, y: (1 - tmpV.y) / 2 * H };
  }

  // --- Render one day -----------------------------------------------
  let currentGames = [];
  const cardEls = new Map();      // gamePk -> element
  const labelEls = new Map();     // venueId -> element

  function renderDay(games) {
    currentGames = games;
    venues.forEach(v => { v.games = []; v.dim = false; });

    // Quiet parks: the current 30 home parks, only when looking at this season
    if (boardDate().slice(0, 4) === String(new Date().getFullYear())) {
      homeParks.forEach(hp => { const v = ensureVenue(hp); if (v) v.dim = true; });
    }

    const activeIds = new Set();
    games.forEach(g => {
      const v = g.venue ? ensureVenue(g.venue) : null;
      g._venue = v;
      if (v) { v.games.push(g); activeIds.add(v.id); }
    });

    let live = 0, fin = 0, up = 0;
    games.forEach(g => { const b = statusBucket(g); if (b === 'live') live++; else if (b === 'final') fin++; else up++; });
    document.getElementById('count-live').textContent = live;
    document.getElementById('count-final').textContent = fin;
    document.getElementById('count-upcoming').textContent = up;

    syncModels(activeIds);

    // Cards: one per game, at most the number of slots
    const shownGames = games.slice(0, SLOTS.length);
    const key = shownGames.map(g => g.gamePk).join(',');
    if (key !== assignmentKey) {
      const items = shownGames.map(g => {
        const v = g._venue;
        const p = v && v.onMap ? toScreen(v.x, LAND_H + 12, v.z) : { x: W / 2, y: H / 2 };
        return { sx: p.x, sy: p.y };
      });
      const slots = assignSlots(items);
      assignment = new Map(shownGames.map((g, i) => [g.gamePk, slots[i]]));
      assignmentKey = key;
    }

    const cards = document.getElementById('cards');
    const keep = new Set();
    shownGames.forEach(g => {
      keep.add(g.gamePk);
      let el = cardEls.get(g.gamePk);
      if (!el) {
        el = document.createElement('div');
        el.addEventListener('click', () => flyTo(g.gamePk));
        cards.appendChild(el);
        cardEls.set(g.gamePk, el);
      }
      const s = SLOTS[assignment.get(g.gamePk)];
      el.className = `mcard ${statusBucket(g)}`;
      el.style.left = `${s.x}px`;
      el.style.top = `${s.y}px`;
      el.innerHTML = cardHtml(g);
    });
    cardEls.forEach((el, pk) => { if (!keep.has(pk)) { el.remove(); cardEls.delete(pk); } });

    // Weather badges over parks with a game
    const labels = document.getElementById('labels');
    const keepL = new Set();
    venues.forEach(v => {
      if (!activeIds.has(v.id) || !v.onMap) return;
      const html = weatherFor(v);
      if (!html) return;
      keepL.add(v.id);
      let el = labelEls.get(v.id);
      if (!el) {
        el = document.createElement('div');
        el.className = 'wx';
        labels.appendChild(el);
        labelEls.set(v.id, el);
      }
      el.innerHTML = html;
    });
    labelEls.forEach((el, id) => { if (!keepL.has(id)) { el.remove(); labelEls.delete(id); } });

    // Today: fetch live conditions for parks without a game-time report, then redraw badges
    if (boardDate() === todayBoardDate()) {
      const need = [...venues.values()].filter(v => activeIds.has(v.id) && v.onMap && !v.games.some(g => g.weather?.temp));
      if (need.length) refreshLiveWeather(need).then(() => {
        need.forEach(v => {
          const html = weatherFor(v);
          if (!html) return;
          let el = labelEls.get(v.id);
          if (!el) { el = document.createElement('div'); el.className = 'wx'; labels.appendChild(el); labelEls.set(v.id, el); }
          el.innerHTML = html;
        });
      });
    }

    document.getElementById('banner').style.display = 'none';
    if (fly) renderFlyPanel();
  }

  async function renderEmpty(date) {
    renderDay([]);
    const banner = document.getElementById('banner');
    let next = '';
    try {
      const url = `${API}?sportId=1&startDate=${addDays(date, 1)}&endDate=${addDays(date, 200)}&gameType=${GAME_TYPES}&fields=dates,date,totalGames`;
      const d = (await (await fetch(url)).json()).dates?.[0];
      if (d) next = `Next games · ${prettyDate(d.date)} · ${d.totalGames} ${d.totalGames === 1 ? 'game' : 'games'}`;
    } catch (err) { /* banner without the next date */ }
    banner.innerHTML = `<h2>No Games <em>${dateOverride ? 'This Day' : 'Today'}</em></h2>${next ? `<div>${next}</div>` : ''}`;
    banner.style.display = 'block';
  }

  // --- Google Earth fly-in --------------------------------------------
  // Photorealistic 3D Tiles. The key only works from harrisdoodle.github.io/MLB-scores/ (and the
  // local test server) and only for the Map Tiles API. The library loads on the first fly-in, so a
  // billable session only starts when someone actually opens one. Google imagery never shares the
  // view with the stylized map, per Google's terms.
  const GOOGLE_TILES_KEY = 'AIzaSyCu1sbXNMHN6dEVJuvGNRTBJwRvbbPDSKg';
  const TILES_LIB = 'https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.2/build';
  const D2R = Math.PI / 180;
  const FLY_MS = 5500;
  let earth = null;   // { renderer, scene, camera, tiles, reorient }
  let fly = null;     // { pk, venue, t0 }

  // Ellipsoid height for the park: field elevation plus a typical US geoid offset
  const parkHeight = v => v.elevFt * 0.3048 - 30;

  async function ensureEarth(v) {
    if (earth) {
      earth.reorient.transformLatLonHeightToOrigin(v.lat * D2R, v.lon * D2R, parkHeight(v));
      return earth;
    }
    const [{ TilesRenderer }, P, { DRACOLoader }] = await Promise.all([
      import(`${TILES_LIB}/index.js`),
      import(`${TILES_LIB}/index.plugins.js`),
      import('three/addons/loaders/DRACOLoader.js')
    ]);
    const r = new THREE.WebGLRenderer({ antialias: true });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    r.setSize(W, H);
    document.getElementById('earth').appendChild(r.domElement);
    const sc = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(38, W / H, 1, 4e6);

    const tiles = new TilesRenderer();
    tiles.registerPlugin(new P.GoogleCloudAuthPlugin({ apiToken: GOOGLE_TILES_KEY, autoRefreshToken: true }));
    tiles.registerPlugin(new P.TileCompressionPlugin());
    tiles.registerPlugin(new P.TilesFadePlugin());
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/');
    tiles.registerPlugin(new P.GLTFExtensionsPlugin({ dracoLoader: draco }));
    // First park is set here so the root tileset lands on it; later parks re-center via transform
    const reorient = new P.ReorientationPlugin({ lat: v.lat * D2R, lon: v.lon * D2R, height: parkHeight(v) });
    tiles.registerPlugin(reorient);
    tiles.addEventListener('load-model', () => { document.getElementById('fly-status').style.display = 'none'; });
    sc.add(tiles.group);
    tiles.setCamera(cam);
    tiles.setResolutionFromRenderer(cam, r);

    earth = { renderer: r, scene: sc, camera: cam, tiles, reorient };
    if (new URLSearchParams(location.search).has('debug')) window.kkEarth = earth;
    return earth;
  }

  async function flyTo(pk) {
    const g = currentGames.find(x => x.gamePk === pk);
    const v = g?._venue;
    if (!v) return;
    fly = { pk, venue: v, t0: performance.now() };
    document.body.classList.add('flying');
    renderFlyPanel();
    const status = document.getElementById('fly-status');
    status.textContent = 'LOADING GOOGLE EARTH…';
    status.style.display = earth ? 'none' : 'block';
    try {
      await ensureEarth(v);
      fly.t0 = performance.now();
    } catch (err) {
      console.error('Google tiles error:', err);
      status.textContent = 'GOOGLE EARTH UNAVAILABLE';
      status.style.display = 'block';
    }
  }

  function closeFly() {
    fly = null;
    document.body.classList.remove('flying');
    document.getElementById('fly-status').style.display = 'none';
  }

  function renderFlyPanel() {
    const g = currentGames.find(x => x.gamePk === fly.pk);
    if (!g) { closeFly(); return; }
    const v = fly.venue;
    const roof = v.roof === 'Open' ? 'Open air' : (v.roof === 'Dome' ? 'Dome' : 'Retractable roof');
    const wx = weatherFor(v);
    document.getElementById('fly').innerHTML = `
      <div class="fly-venue">
        <h2>${v.name}</h2>
        <div class="meta">${v.city} · ${roof} · ${Number(v.elevFt).toLocaleString()} ft</div>
        ${wx ? `<div class="wx">${wx}</div>` : ''}
      </div>
      <div class="mcard ${statusBucket(g)}">${cardHtml(g)}</div>
      <div class="fly-actions">
        <button class="nav-btn" data-fly-close>‹ Back to map</button>
        <a class="nav-btn" href="index.html?date=${boardDate()}&game=${g.gamePk}">Box score</a>
      </div>`;
  }

  document.getElementById('fly').addEventListener('click', e => {
    if (e.target.closest('[data-fly-close]')) closeFly();
  });

  const easeInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  let lastAttr = 0;

  // High-home shot: behind the plate, looking out toward center field, with a slow sway
  function renderEarth(now) {
    const { renderer: r, scene: sc, camera: cam, tiles } = earth;
    const v = fly.venue;
    const elapsed = now - fly.t0;
    const k = easeInOut(Math.min(1, elapsed / FLY_MS));
    const radius = 3400 + (400 - 3400) * k;
    const height = 2600 + (175 - 2600) * k;
    const cf = v.azimuth * D2R;                       // compass bearing home plate -> center field
    const sway = Math.sin(elapsed / 1000 * 0.1) * 0.6 * k;
    const b = cf + Math.PI + sway;                    // stand on the home-plate side
    // Reorientation frame: X = west, Z = north, Y = up
    cam.position.set(-Math.sin(b) * radius, height, Math.cos(b) * radius);
    cam.lookAt(-Math.sin(cf) * 40, 0, Math.cos(cf) * 40);
    cam.updateMatrixWorld();
    tiles.setCamera(cam);
    tiles.setResolutionFromRenderer(cam, r);
    tiles.update();
    r.render(sc, cam);

    if (now - lastAttr > 1000) {
      lastAttr = now;
      const text = tiles.getAttributions().filter(a => a.type === 'string').map(a => a.value).join(' ');
      document.getElementById('google-attr').textContent = text;
    }
  }

  // --- Per-frame overlays ------------------------------------------
  const linesSvg = document.getElementById('lines');
  const clock = new THREE.Clock();

  function frame(now) {
    if (fly && earth) {
      renderEarth(now);
      requestAnimationFrame(frame);
      return;
    }
    if (fly) { requestAnimationFrame(frame); return; }
    const t = clock.getElapsedTime();
    // Slow broadcast drift
    camera.position.set(CAM_BASE.x + Math.sin(t * 0.06) * 40, CAM_BASE.y, CAM_BASE.z + Math.cos(t * 0.05) * 12);
    camera.lookAt(CAM_TARGET);

    const pulse = (t * 0.8) % 1;
    venues.forEach(v => {
      const ring = v.model?.userData.ring;
      if (ring && ring.visible) {
        ring.scale.setScalar(1 + pulse * 0.8);
        ring.material.opacity = 0.7 * (1 - pulse);
      }
    });

    renderer.render(scene, camera);

    // Weather badges ride above their park
    labelEls.forEach((el, id) => {
      const v = venues.get(id);
      const p = toScreen(v.x, LAND_H + 13 * STADIUM_SCALE, v.z);
      el.style.transform = `translate(${p.x - el.offsetWidth / 2}px, ${p.y - el.offsetHeight}px)`;
    });

    // Leader lines from each card to its park
    let svg = '';
    currentGames.forEach(g => {
      const v = g._venue;
      const el = cardEls.get(g.gamePk);
      if (!v || !v.onMap || !el) return;
      const s = SLOTS[assignment.get(g.gamePk)];
      const p = toScreen(v.x, LAND_H + 6, v.z);
      // Attach to the card edge nearest the park
      const ex = Math.max(s.x, Math.min(p.x, s.x + CARD_W));
      const ey = Math.max(s.y, Math.min(p.y, s.y + CARD_H));
      const b = statusBucket(g);
      const color = b === 'live' ? 'var(--live)' : (b === 'upcoming' ? 'var(--upcoming)' : 'var(--dim)');
      svg += `<line x1="${ex}" y1="${ey}" x2="${p.x}" y2="${p.y}" stroke="${color}" stroke-width="1.5" stroke-opacity="0.7"/>` +
             `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${color}"/>`;
    });
    linesSvg.innerHTML = svg;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // --- Fetch + poll ---------------------------------------------------
  let pollTimer = null, fetchSeq = 0;

  async function fetchGames() {
    clearTimeout(pollTimer);
    const seq = ++fetchSeq;
    const date = boardDate();
    const url = `${API}?sportId=1&date=${date}&gameType=${GAME_TYPES}&hydrate=linescore,team,weather,venue(location,fieldInfo)`;
    let next = POLL_IDLE, ok = false;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (seq !== fetchSeq) return;
      const games = data.dates?.[0]?.games || [];
      const order = { live: 0, upcoming: 1, final: 2 };
      games.sort((a, b) => order[statusBucket(a)] - order[statusBucket(b)] || new Date(a.gameDate) - new Date(b.gameDate));
      if (games.length) {
        renderDay(games);
        next = games.some(g => statusBucket(g) === 'live') ? POLL_LIVE : POLL_IDLE;
      } else {
        await renderEmpty(date);
        next = POLL_EMPTY;
      }
      ok = true;
    } catch (err) {
      if (seq !== fetchSeq) return;
      console.error('Feed error:', err);
      next = POLL_LIVE;
    }
    if (ok && dateOverride && dateOverride < toISO(new Date())) return;
    pollTimer = setTimeout(fetchGames, next);
  }

  function goToDate(iso, push = true) {
    if (iso < FIRST_DATE) iso = FIRST_DATE;
    dateOverride = iso === todayBoardDate() ? null : iso;
    if (push) {
      const url = new URL(location.href);
      if (dateOverride) url.searchParams.set('date', dateOverride); else url.searchParams.delete('date');
      history.pushState(null, '', url);
    }
    assignmentKey = '';
    closeFly();
    updateClock();
    fetchGames();
  }

  window.addEventListener('popstate', () => goToDate(dateFromUrl() || todayBoardDate(), false));
  document.getElementById('day-prev').addEventListener('click', () => goToDate(addDays(boardDate(), -1)));
  document.getElementById('day-next').addEventListener('click', () => goToDate(addDays(boardDate(), 1)));
  document.getElementById('day-today').addEventListener('click', () => goToDate(todayBoardDate()));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeFly();
    else if (fly) return;
    else if (e.key === 'ArrowLeft') goToDate(addDays(boardDate(), -1));
    else if (e.key === 'ArrowRight') goToDate(addDays(boardDate(), 1));
  });

  await loadHomeParks();
  fetchGames();
</script>
</body>
</html>
